<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/medicine.css}">
</head>
<body>
<div th:fragment="sidebar">
    <div class="sidebar flex-shrink-0 p-0">
        <div class="sidebar-header">
            <i class="bi bi-capsule-pill sidebar-logo"></i>
            <div class="sidebar-title">
                <div>QUẢN LÍ CỬA</div>
                <div>HÀNG THUỐC</div>
            </div>
        </div>
        <nav class="nav flex-column">
            <a th:if="${isManager}" class="nav-link" th:classappend="${activeNav == 'home'} ? 'active'" th:href="@{/dashboard}">
                <i class="bi bi-house"></i> Trang chủ
            </a>
            <a class="nav-link" th:classappend="${activeNav == 'medicines'} ? 'active'" th:href="@{/medicines/view-medicine}">
                <i class="bi bi-archive-fill"></i> Quản lí thuốc
            </a>
            <a class="nav-link" th:classappend="${activeNav == 'customers'} ? 'active'" th:href="@{/customers/view-customers}">
                <i class="bi bi-people"></i> Quản lí khách hàng
            </a>
            <a th:if="${isManager}" class="nav-link" th:classappend="${activeNav == 'staff'} ? 'active'" th:href="@{/api/staff/view-staff}">
                <i class="bi bi-person"></i> Quản lí nhân viên
            </a>
            <a class="nav-link" th:classappend="${activeNav == 'promotions'} ? 'active'" th:href="@{/promotions}">
                <i class="bi bi-gift"></i> Quản lí khuyến mãi
            </a>
            <a class="nav-link" th:classappend="${activeNav == 'orders'} ? 'active'" th:href="@{/orders/view-orders}">
                <i class="bi bi-receipt"></i> Quản lí đơn hàng
            </a>
            <a class="nav-link" th:classappend="${activeNav == 'payment'} ? 'active'" th:href="@{/payments/view-payments}">
                <i class="bi bi-credit-card"></i> Thanh toán
            </a>
        </nav>

        <div class="sidebar-user">
            <div class="dropdown dropup">
                <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle"
                   id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="avatar-circle me-2">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <div class="user-info">
                        <div class="user-role">
                            <span th:if="${isManager}" class="badge bg-danger">Admin</span>
                            <span th:if="${!isManager}" class="badge bg-info">Nhân viên</span>
                        </div>
                    </div>
                </a>
                <ul class="dropdown-menu shadow" aria-labelledby="userDropdown">
                    <li>
                        <form th:action="@{/logout}" method="post" style="margin: 0;">
                            <button type="submit" class="dropdown-item text-danger">
                                <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
</body>
</html>
