<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ CỬA HÀNG THUỐC - Thêm/Sửa Nhân Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/medicine.css}">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{sidebar :: sidebar}"></div>

    <div class="flex-grow-1 bg-light p-4">
        <div class="container-fluid">
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${message != null}" class="alert alert-success" th:text="${message}"></div>

            <div class="p-4">
                <h2 class="h4 mb-4" th:text="${staff.id != null} ? 'Sửa Nhân Viên' : 'Thêm Nhân Viên Mới'"></h2>
                <form th:action="${staff.id != null} ? @{/api/staff/update/{id}(id=${staff.id})} : @{/api/staff/add}"
                      th:object="${staff}"
                      method="post"
                      id="staffForm">
                    <input type="hidden" name="_method" th:value="${staff.id != null} ? 'PUT' : 'POST'">
                    <input type="hidden" name="page" th:value="${page}">
                    <input type="hidden" name="size" th:value="${size}">
                    <input type="hidden" name="sortBy" th:value="${sortBy}">
                    <input type="hidden" name="sortDirection" th:value="${sortDirection}">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Tên nhân viên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="phone" th:field="*{phone}" required pattern="[0-9]{10,15}" title="Số điện thoại phải từ 10 đến 15 chữ số">
                        </div>
                        <div class="col-md-6">
                            <label for="role" class="form-label">Chức vụ <span class="text-danger">*</span></label>
                            <select class="form-select" id="role" th:field="*{role}" required>
                                <option value="">Chọn chức vụ</option>
                                <option th:each="r : ${T(com.example.quanlicuahangthuoc.entity.Staff.Role).values()}"
                                        th:value="${r}"
                                        th:text="${r.displayName}"
                                        th:selected="${staff.role == r}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="workShift" class="form-label">Ca làm việc <span class="text-danger">*</span></label>
                            <select class="form-select" id="workShift" th:field="*{workShift}" required>
                                <option value="">Chọn ca làm việc</option>
                                <option th:each="ws : ${T(com.example.quanlicuahangthuoc.entity.Staff.WorkShift).values()}"
                                        th:value="${ws}"
                                        th:text="${ws.displayName}"
                                        th:selected="${staff.workShift == ws}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="salary" class="form-label">Lương <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="salary" th:field="*{salary}" step="0.01" min="0" required lang="en">
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary d-flex align-items-center gap-2">
                            <i class="bi bi-save"></i> Lưu
                        </button>
                        <a class="btn btn-secondary d-flex align-items-center gap-2" th:href="@{/api/staff/view-staff(page=${page}, size=${size}, sortBy=${sortBy}, sortDirection=${sortDirection}, name=${name}, role=${role})}">
                            <i class="bi bi-x"></i> Hủy
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('staffForm');
        const salaryInput = document.getElementById('salary');

        form.addEventListener('submit', (event) => {
            // Loại bỏ dấu phẩy trong giá trị salary trước khi gửi
            if (salaryInput.value) {
                salaryInput.value = salaryInput.value.replace(/,/g, '');
            }
        });
    });
</script>
</body>
</html>
