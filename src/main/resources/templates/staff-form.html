<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ CỬA HÀNG THUỐC - Thêm/Sửa Nhân Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/medicine.css}">
    <link rel="stylesheet" th:href="@{/notification.css}">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{sidebar :: sidebar}"></div>

    <div class="main-content flex-grow-1 bg-light p-4">
        <div class="container-fluid">
            <div class="mb-4">
                <h1 class="display-6 fw-bold text-primary">
                    <i class="bi bi-person-badge"></i>
                    <span th:if="${staff.id == null}">THÊM NHÂN VIÊN MỚI</span>
                    <span th:if="${staff.id != null}">SỬA THÔNG TIN NHÂN VIÊN</span>
                </h1>
            </div>

            <form th:action="${staff.id != null} ? @{/api/staff/update/{id}(id=${staff.id})} : @{/api/staff/add}"
                  th:object="${staff}"
                  method="post"
                  id="staffForm"
                  enctype="multipart/form-data">

                <!-- Hidden fields để giữ lại tham số phân trang và lọc -->
                <input type="hidden" name="page" th:value="${page != null ? page : 0}">
                <input type="hidden" name="size" th:value="${size != null ? size : 10}">
                <input type="hidden" name="sortBy" th:value="${sortBy != null ? sortBy : 'id'}">
                <input type="hidden" name="sortDirection" th:value="${sortDirection != null ? sortDirection : 'desc'}">
                <input type="hidden" name="nameFilter" th:value="${name}">
                <input type="hidden" name="roleFilter" th:value="${role}">

                <div class="row g-3">
                    <!-- Tên nhân viên -->
                    <div class="col-md-6">
                        <label for="name" class="form-label">
                            <i class="bi bi-person"></i> Tên nhân viên <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               class="form-control"
                               id="name"
                               th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               placeholder="Nhập tên nhân viên..."
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6">
                        <label for="email" class="form-label">
                            <i class="bi bi-envelope"></i> Email <span class="text-danger">*</span>
                        </label>
                        <input type="email"
                               class="form-control"
                               id="email"
                               th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               placeholder="example@email.com"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <!-- Số điện thoại -->
                    <div class="col-md-6">
                        <label for="phoneInput" class="form-label">
                            <i class="bi bi-telephone"></i> Số điện thoại <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               class="form-control"
                               id="phoneInput"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                               placeholder="Nhập số điện thoại (10-15 chữ số)..."
                               inputmode="numeric"
                               autocomplete="off"
                               required>
                        <input type="hidden" id="phone" name="phone" th:value="*{phone}">
                        <div class="invalid-feedback" id="phoneErrorContainer">
                            <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                            <span id="customPhoneError" style="display: none;">Số điện thoại phải từ 10 đến 15 chữ số</span>
                        </div>
                        <small class="text-muted">Chỉ nhập số, từ 10-15 chữ số</small>
                    </div>

                    <!-- Vai trò -->
                    <div class="col-md-6">
                        <label for="roleSelect" class="form-label">
                            <i class="bi bi-briefcase"></i> Chức vụ <span class="text-danger">*</span>
                        </label>
                        <select class="form-select"
                                id="roleSelect"
                                th:field="*{role}"
                                th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'"
                                required>
                            <option value="">-- Chọn chức vụ --</option>
                            <option th:each="r : ${T(com.example.quanlicuahangthuoc.entity.Staff.Role).values()}"
                                    th:value="${r}"
                                    th:text="${r.displayName}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                    </div>

                    <!-- Ca làm việc -->
                    <div class="col-md-6">
                        <label for="workShiftSelect" class="form-label">
                            <i class="bi bi-clock"></i> Ca làm việc <span class="text-danger">*</span>
                        </label>
                        <select class="form-select"
                                id="workShiftSelect"
                                th:field="*{workShift}"
                                th:classappend="${#fields.hasErrors('workShift')} ? 'is-invalid'"
                                required>
                            <option value="">-- Chọn ca làm việc --</option>
                            <option th:each="ws : ${T(com.example.quanlicuahangthuoc.entity.Staff.WorkShift).values()}"
                                    th:value="${ws}"
                                    th:text="${ws.displayName}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('workShift')}" th:errors="*{workShift}"></div>
                    </div>

                    <!-- Lương -->
                    <div class="col-md-6">
                        <label for="salary" class="form-label">
                            <i class="bi bi-cash"></i> Lương (VNĐ) <span class="text-danger">*</span>
                        </label>
                        <input type="number"
                               class="form-control"
                               id="salary"
                               th:field="*{salary}"
                               th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid'"
                               step="1000"
                               min="0"
                               placeholder="Nhập lương..."
                               required
                               lang="en">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                    </div>
                </div>

                <!-- Ảnh nhân viên (di chuyển xuống cuối) -->
                <div class="row g-3 mt-3">
                    <div class="col-md-6">
                        <label for="imageFile" class="form-label">
                            <i class="bi bi-image"></i> Ảnh nhân viên
                        </label>
                        <input type="file"
                               class="form-control"
                               id="imageFile"
                               name="imageFile"
                        accept="image/*"
                        onchange="previewImage(event)">
                        <small class="text-muted">Định dạng: JPG, PNG, GIF (tối đa 5MB)</small>

                        <!-- Hiển thị ảnh hiện tại nếu đang sửa -->
                        <div th:if="${staff.image != null and staff.image != ''}" class="mt-2">
                            <p class="mb-1 fw-bold">Ảnh hiện tại:</p>
                            <img th:src="${staff.image}"
                                 th:onerror="this.src ='/images/default-staff.jpg'"
                                 alt="Current Image"
                                 class="img-thumbnail"
                                 style="width: 150px; height: 150px; object-fit: cover;">
                        </div>

                        <!-- Preview ảnh mới -->
                        <div id="imagePreview" class="mt-2" style="display: none;">
                            <p class="mb-1 fw-bold">Ảnh mới:</p>
                            <img id="previewImg" class="img-thumbnail" style="width: 150px; height: 150px; object-fit: cover;">
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary d-flex align-items-center gap-2">
                        <i class="bi bi-check-circle"></i> Lưu
                    </button>
                    <a class="btn btn-secondary d-flex align-items-center gap-2"
                       th:href="@{/api/staff/view-staff(page=${page}, size=${size}, sortBy=${sortBy}, sortDirection=${sortDirection}, name=${name}, role=${role})}">
                        <i class="bi bi-x-circle"></i> Hủy
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/notification.js}"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('staffForm');
        const salaryInput = document.getElementById('salary');
        const phoneInput = document.getElementById('phoneInput');
        const phoneHidden = document.getElementById('phone');
        const customPhoneError = document.getElementById('customPhoneError');

        // ========== XỬ LÝ PREVIEW ẢNH ==========
        window.previewImage = function(event) {
            const file = event.target.files[0];
            const previewImg = document.getElementById('previewImg');
            const imagePreview = document.getElementById('imagePreview');

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                imagePreview.style.display = 'none';
            }
        };

        // ========== XỬ LÝ SỐ ĐIỆN THOẠI ==========
        const initialPhone = phoneHidden.value;
        if (initialPhone && initialPhone.trim() !== '') {
            const cleanPhone = initialPhone.replace(/[^0-9]/g, '');
            phoneInput.value = cleanPhone;
            phoneHidden.value = cleanPhone;
        }

        function cleanPhoneNumber(value) {
            return value.replace(/[^0-9]/g, '');
        }

        phoneInput.addEventListener('input', (e) => {
            let cleanValue = cleanPhoneNumber(e.target.value);
            if (cleanValue.length > 15) {
                cleanValue = cleanValue.substring(0, 15);
            }
            phoneInput.value = cleanValue;
            phoneHidden.value = cleanValue;

            if (cleanValue.length >= 10 && cleanValue.length <= 15) {
                phoneInput.classList.remove('is-invalid');
                phoneInput.classList.add('is-valid');
                customPhoneError.style.display = 'none';
            } else if (cleanValue.length > 0) {
                phoneInput.classList.remove('is-valid');
                phoneInput.classList.add('is-invalid');
                customPhoneError.style.display = 'block';
            } else {
                phoneInput.classList.remove('is-valid', 'is-invalid');
                customPhoneError.style.display = 'none';
            }
        });

        phoneInput.addEventListener('keypress', (e) => {
            const char = String.fromCharCode(e.which);
            if (!/[0-9]/.test(char)) {
                e.preventDefault();
            }
        });

        phoneInput.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedText = (e.clipboardData || window.clipboardData).getData('text');
            const cleanedText = cleanPhoneNumber(pastedText).substring(0, 15);
            phoneInput.value = cleanedText;
            phoneHidden.value = cleanedText;
            phoneInput.dispatchEvent(new Event('input', { bubbles: true }));
        });

        // ========== VALIDATE TRƯỚC KHI SUBMIT ==========
        form.addEventListener('submit', (e) => {
            // Xử lý salary
            if (salaryInput.value) {
                salaryInput.value = salaryInput.value.replace(/,/g, '');
            }

            // Validate phone
            const finalPhone = cleanPhoneNumber(phoneInput.value);
            phoneInput.value = finalPhone;
            phoneHidden.value = finalPhone;

            if (finalPhone.length < 10 || finalPhone.length > 15) {
                e.preventDefault();
                e.stopPropagation();
                phoneInput.classList.add('is-invalid');
                customPhoneError.style.display = 'block';

                if (typeof notification !== 'undefined') {
                    notification.showError('Số điện thoại phải từ 10 đến 15 chữ số!');
                }
                phoneInput.focus();
                return false;
            }

            if (!/^[0-9]+$/.test(finalPhone)) {
                e.preventDefault();
                e.stopPropagation();
                phoneInput.classList.add('is-invalid');

                if (typeof notification !== 'undefined') {
                    notification.showError('Số điện thoại chỉ được chứa chữ số!');
                }
                phoneInput.focus();
                return false;
            }
        });

        // Hiển thị notification nếu có lỗi từ server
        const errorMessage = /*[[${error}]]*/ null;
        const successMessage = /*[[${message}]]*/ null;

        if (errorMessage && typeof notification !== 'undefined') {
            notification.showError(errorMessage);
        }

        if (successMessage && typeof notification !== 'undefined') {
            notification.showSuccess(successMessage);
        }
    });
</script>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
