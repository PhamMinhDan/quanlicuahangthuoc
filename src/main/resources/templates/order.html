<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ CỬA HÀNG THUỐC - Danh Sách Đơn Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/medicine.css}">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{sidebar :: sidebar}"></div>

    <div class="flex-grow-1 bg-light p-4">
        <div class="container-fluid">
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${message != null}" class="alert alert-success" th:text="${message}"></div>

            <div class="row g-4 mb-4 justify-content-center">
                <div class="col-md-4">
                    <div class="summary-card summary-card-1">
                        <div class="position-relative z-10 text-center">
                            <div class="text-sm opacity-80 mb-2">Tổng Số Đơn Hàng</div>
                            <div class="text-3xl font-bold" th:text="${totalOrders != null ? totalOrders : 0}"></div>
                        </div>
                        <i class="bi bi-cart-fill position-absolute bottom-0 end-0 me-3 mb-3 opacity-50" style="font-size: 48px;"></i>
                    </div>
                </div>
            </div>

            <div class="filter-panel mb-4">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <i class="bi bi-funnel-fill text-secondary" style="font-size: 20px;"></i>
                    <h2 class="h5 mb-0">Bộ lọc</h2>
                </div>
                <form th:action="@{/orders/view-orders}" method="get">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Mã khách hàng</label>
                            <input type="number" class="form-control" id="customerId" name="customerId" th:value="${customerId}" placeholder="Mã khách hàng" min="1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Ngày đặt hàng</label>
                            <input type="date" class="form-control" id="orderDate" name="orderDate" th:value="${orderDate}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Trạng thái</label>
                            <select class="form-select" id="status" name="status">
                                <option value="">Chọn trạng thái</option>
                                <option th:each="s : ${T(com.example.quanlicuahangthuoc.entity.Order.OrderStatus).values()}"
                                        th:value="${s}"
                                        th:text="${s.displayName}"
                                        th:selected="${status == s}"></option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end gap-2">
                            <button class="btn btn-primary flex-grow-1 d-flex align-items-center justify-content-center gap-2" type="submit" id="filterButton">
                                <i class="bi bi-search"></i> Lọc
                            </button>
                            <button class="btn btn-secondary flex-grow-1 d-flex align-items-center justify-content-center gap-2" type="button" id="clearFilters">
                                <i class="bi bi-x"></i> Xóa Lọc
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <div class="p-4 d-flex justify-content-between align-items-center border-bottom">
                    <h2 class="h4">Danh Sách Đơn Hàng</h2>
                    <div class="d-flex gap-2">
                        <div class="dropdown">
                            <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="sortDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                Sắp xếp
                            </button>
                            <ul class="dropdown-menu" aria-labelledby="sortDropdown">
                                <li><a class="dropdown-item" th:href="@{/orders/view-orders(page=${currentPage}, size=${pageSize}, sortBy='orderDate', sortDirection='asc', customerId=${customerId}, orderDate=${orderDate}, status=${status})}">Ngày tăng dần</a></li>
                                <li><a class="dropdown-item" th:href="@{/orders/view-orders(page=${currentPage}, size=${pageSize}, sortBy='orderDate', sortDirection='desc', customerId=${customerId}, orderDate=${orderDate}, status=${status})}">Ngày giảm dần</a></li>
                                <li><a class="dropdown-item" th:href="@{/orders/view-orders(page=${currentPage}, size=${pageSize}, sortBy='totalAmount', sortDirection='asc', customerId=${customerId}, orderDate=${orderDate}, status=${status})}">Tổng tiền tăng dần</a></li>
                                <li><a class="dropdown-item" th:href="@{/orders/view-orders(page=${currentPage}, size=${pageSize}, sortBy='totalAmount', sortDirection='desc', customerId=${customerId}, orderDate=${orderDate}, status=${status})}">Tổng tiền giảm dần</a></li>
                            </ul>
                        </div>
                        <a class="btn btn-success d-flex align-items-center gap-2" th:href="@{/orders/add}">
                            <i class="bi bi-plus"></i> Thêm mới đơn hàng
                        </a>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>
                                ID
                                <a th:href="@{/orders/view-orders(page=${currentPage}, size=${pageSize}, sortBy='id', sortDirection=${sortBy == 'id' and sortDirection == 'asc' ? 'desc' : 'asc'}, customerId=${customerId}, orderDate=${orderDate}, status=${status})}">
                                    <i th:class="${sortBy == 'id'} ? (${sortDirection == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up'"></i>
                                </a>
                            </th>
                            <th>Mã KH</th>
                            <th>Mã NV</th>
                            <th>Mã KM</th>
                            <th>
                                Ngày
                                <a th:href="@{/orders/view-orders(page=${currentPage}, size=${pageSize}, sortBy='orderDate', sortDirection=${sortBy == 'orderDate' and sortDirection == 'asc' ? 'desc' : 'asc'}, customerId=${customerId}, orderDate=${orderDate}, status=${status})}">
                                    <i th:class="${sortBy == 'orderDate'} ? (${sortDirection == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up'"></i>
                                </a>
                            </th>
                            <th>Trạng thái</th>
                            <th>
                                Tổng tiền
                                <a th:href="@{/orders/view-orders(page=${currentPage}, size=${pageSize}, sortBy='totalAmount', sortDirection=${sortBy == 'totalAmount' and sortDirection == 'asc' ? 'desc' : 'asc'}, customerId=${customerId}, orderDate=${orderDate}, status=${status})}">
                                    <i th:class="${sortBy == 'totalAmount'} ? (${sortDirection == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up'"></i>
                                </a>
                            </th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="order : ${orders}">
                            <td th:text="${order.id}"></td>
                            <td th:text="${order.customer != null ? order.customer.id : 'N/A'}"></td>
                            <td th:text="${order.staff != null ? order.staff.id : 'N/A'}"></td>
                            <td th:text="${order.promotion != null ? order.promotion.id : 'N/A'}"></td>
                            <td th:text="${order.orderDate != null ? #temporals.format(order.orderDate, 'dd/MM/yyyy') : 'N/A'}"></td>
                            <td th:text="${order.status != null ? order.status.displayName : 'N/A'}"></td>
                            <td th:text="${order.totalAmount != null ? #numbers.formatDecimal(order.totalAmount, 0, 2, 'COMMA') + ' VNĐ' : 'N/A'}"></td>
                            <td>
                                <div class="d-flex gap-2">
                                    <a class="btn btn-primary btn-sm btn-action-edit text-white" th:href="@{/orders/edit/{id}(id=${order.id}, page=${currentPage}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, customerId=${customerId}, orderDate=${orderDate}, status=${status})}">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button class="btn btn-danger btn-sm btn-action-delete text-white" th:onclick="'deleteOrder(' + ${order.id} + ')'">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${orders == null or orders.isEmpty()}">
                            <td colspan="8" class="text-center">Không tìm thấy dữ liệu đơn hàng nào.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-3 d-flex justify-content-center border-top" th:if="${totalPages > 1}">
                    <nav aria-label="Phân trang danh sách đơn hàng">
                        <ul class="pagination mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link text-dark" th:href="@{/orders/view-orders(page=${currentPage - 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, customerId=${customerId}, orderDate=${orderDate}, status=${status})}" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>
                            <li class="page-item" th:if="${currentPage > 2}">
                                <a class="page-link text-dark" th:href="@{/orders/view-orders(page=0, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, customerId=${customerId}, orderDate=${orderDate}, status=${status})}">1</a>
                            </li>
                            <li class="page-item disabled" th:if="${currentPage > 3}">
                                <span class="page-link text-dark">...</span>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(currentPage - 2 > 0 ? currentPage - 2 : 0, currentPage + 2 < totalPages - 1 ? currentPage + 2 : totalPages - 1)}">
                                <a class="page-link text-dark" th:href="@{/orders/view-orders(page=${i}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, customerId=${customerId}, orderDate=${orderDate}, status=${status})}" th:classappend="${i == currentPage} ? 'active'" th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item disabled" th:if="${currentPage < totalPages - 4}">
                                <span class="page-link text-dark">...</span>
                            </li>
                            <li class="page-item" th:if="${currentPage < totalPages - 3}">
                                <a class="page-link text-dark" th:href="@{/orders/view-orders(page=${totalPages - 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, customerId=${customerId}, orderDate=${orderDate}, status=${status})}" th:text="${totalPages}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link text-dark" th:href="@{/orders/view-orders(page=${currentPage + 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, customerId=${customerId}, orderDate=${orderDate}, status=${status})}" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                window.location.href = link.getAttribute('href');
            });
        });

        document.getElementById('clearFilters').addEventListener('click', () => {
            window.location.href = '/orders/view-orders';
        });

        const currentPage = [[${currentPage}]];
        const pageSize = [[${pageSize}]];
        const sortBy = [[${sortBy}]];
        const sortDirection = [[${sortDirection}]];
        const customerId = [[${customerId}]] || '';
        const orderDate = [[${orderDate}]] || '';
        const status = [[${status}]] || '';

        window.deleteOrder = function(id) {
            if (confirm('Bạn có chắc muốn xóa đơn hàng này?')) {
                fetch(`/orders/delete/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        page: currentPage,
                        size: pageSize,
                        sortBy: sortBy,
                        sortDirection: sortDirection,
                        customerId: customerId,
                        orderDate: orderDate,
                        status: status
                    })
                })
                    .then(response => {
                        if (response.ok) {
                            window.location.reload();
                        } else {
                            response.text().then(text => alert('Xóa thất bại: ' + (text || 'Lỗi không xác định')));
                        }
                    })
                    .catch(error => alert('Lỗi khi xóa đơn hàng: ' + error.message));
            }
        };
    });
</script>
</body>
</html>
