<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ CỬA HÀNG THUỐC - Nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/medicine.css}">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{sidebar :: sidebar}"></div>

    <div class="flex-grow-1 bg-light p-4">
        <div class="container-fluid">
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${message != null}" class="alert alert-success" th:text="${message}"></div>

            <div class="row g-4 mb-4 justify-content-center">
                <div class="col-md-4">
                    <div class="summary-card summary-card-1">
                        <div class="position-relative z-10 text-center">
                            <div class="text-sm opacity-80 mb-2">Tổng Số Nhân Viên</div>
                            <div class="text-3xl font-bold" th:text="${totalStaff != null ? totalStaff : 0}"></div>
                        </div>
                        <i class="bi bi-person-fill position-absolute bottom-0 end-0 me-3 mb-3 opacity-50" style="font-size: 48px;"></i>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="summary-card summary-card-2">
                        <div class="position-relative z-10 text-center">
                            <div class="text-sm opacity-80 mb-2">Tổng Quản Lý</div>
                            <div class="text-3xl font-bold" th:text="${totalManagers != null ? totalManagers : 0}"></div>
                        </div>
                        <i class="bi bi-person-badge position-absolute bottom-0 end-0 me-3 mb-3 opacity-50" style="font-size: 48px;"></i>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="summary-card summary-card-3">
                        <div class="position-relative z-10 text-center">
                            <div class="text-sm opacity-80 mb-2">Tổng Nhân Viên</div>
                            <div class="text-3xl font-bold" th:text="${totalStaff != null && totalManagers != null ? totalStaff - totalManagers : 0}"></div>
                        </div>
                        <i class="bi bi-people position-absolute bottom-0 end-0 me-3 mb-3 opacity-50" style="font-size: 48px;"></i>
                    </div>
                </div>
            </div>

            <div class="filter-panel mb-4">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <i class="bi bi-funnel-fill text-secondary" style="font-size: 20px;"></i>
                    <h2 class="h5 mb-0">Bộ lọc</h2>
                </div>
                <form th:action="@{/api/staff/view-staff}" method="get">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Tên nhân viên</label>
                            <input type="text" class="form-control" id="searchName" name="name" th:value="${name}" placeholder="Tên nhân viên">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Chức vụ</label>
                            <select class="form-select" id="searchRole" name="role">
                                <option value="">Tất cả chức vụ</option>
                                <option value="quan_ly" th:selected="${role == 'quan_ly'}">Quản lý</option>
                                <option value="nhan_vien" th:selected="${role == 'nhan_vien'}">Nhân viên</option>
                            </select>
                        </div>
                        <div class="col-md-6 d-flex align-items-end gap-2">
                            <button class="btn btn-primary flex-grow-1 d-flex align-items-center justify-content-center gap-2" type="submit" id="filterButton">
                                <i class="bi bi-search"></i> Lọc
                            </button>
                            <button class="btn btn-secondary flex-grow-1 d-flex align-items-center justify-content-center gap-2" type="button" id="clearFilters">
                                <i class="bi bi-x"></i> Xóa Lọc
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <div class="p-4 d-flex justify-content-between align-items-center border-bottom">
                    <h2 class="h4">Danh sách nhân viên</h2>
                    <div class="d-flex gap-2">
                        <div class="dropdown">
                            <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="sortDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                Sắp xếp
                            </button>
                            <ul class="dropdown-menu" aria-labelledby="sortDropdown">
                                <li><a class="dropdown-item" th:href="@{/api/staff/view-staff(page=${currentPage}, size=${pageSize}, sortBy='name', sortDirection='asc', name=${name}, role=${role})}">Tên A-Z</a></li>
                                <li><a class="dropdown-item" th:href="@{/api/staff/view-staff(page=${currentPage}, size=${pageSize}, sortBy='name', sortDirection='desc', name=${name}, role=${role})}">Tên Z-A</a></li>
                                <li><a class="dropdown-item" th:href="@{/api/staff/view-staff(page=${currentPage}, size=${pageSize}, sortBy='salary', sortDirection='asc', name=${name}, role=${role})}">Lương từ bé đến lớn</a></li>
                                <li><a class="dropdown-item" th:href="@{/api/staff/view-staff(page=${currentPage}, size=${pageSize}, sortBy='salary', sortDirection='desc', name=${name}, role=${role})}">Lương từ lớn đến bé</a></li>
                            </ul>
                        </div>
                        <a class="btn btn-success d-flex align-items-center gap-2" th:href="@{/api/staff/add}">
                            <i class="bi bi-plus"></i> Thêm nhân viên mới
                        </a>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>
                                Tên
                                <a th:href="@{/api/staff/view-staff(page=${currentPage}, size=${pageSize}, sortBy='name', sortDirection=${sortBy == 'name' and sortDirection == 'asc' ? 'desc' : 'asc'}, name=${name}, role=${role})}">
                                    <i th:class="${sortBy == 'name'} ? (${sortDirection == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up'"></i>
                                </a>
                            </th>
                            <th>Email</th>
                            <th>SĐT</th>
                            <th>Chức vụ</th>
                            <th>Ca làm việc</th>
                            <th>
                                Lương
                                <a th:href="@{/api/staff/view-staff(page=${currentPage}, size=${pageSize}, sortBy='salary', sortDirection=${sortBy == 'salary' and sortDirection == 'asc' ? 'desc' : 'asc'}, name=${name}, role=${role})}">
                                    <i th:class="${sortBy == 'salary'} ? (${sortDirection == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up'"></i>
                                </a>
                            </th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="staff : ${staffs}">
                            <td th:text="${staff.id}"></td>
                            <td th:text="${staff.name}"></td>
                            <td th:text="${staff.email}"></td>
                            <td th:text="${staff.phone}"></td>
                            <td th:text="${staff.role != null ? staff.role.displayName : 'N/A'}"></td>
                            <td th:text="${staff.workShift != null ? staff.workShift.displayName : 'N/A'}"></td>
                            <td th:text="${staff.salary != null ? #numbers.formatDecimal(staff.salary, 0, 2, 'COMMA') + ' VNĐ' : 'N/A'}"></td>
                            <td>
                                <div class="d-flex gap-2">
                                    <a class="btn btn-primary btn-sm btn-action-edit text-white" th:href="@{/api/staff/edit/{id}(id=${staff.id}, page=${currentPage}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, name=${name}, role=${role})}"><i class="bi bi-pencil"></i></a>
                                    <button class="btn btn-danger btn-sm btn-action-delete text-white" th:onclick="'deleteStaff(' + ${staff.id} + ')'"><i class="bi bi-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${staffs == null or staffs.isEmpty()}">
                            <td colspan="8" class="text-center">Không tìm thấy dữ liệu nhân viên nào.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-3 d-flex justify-content-center border-top" th:if="${totalPages > 1}">
                    <nav aria-label="Phân trang danh sách nhân viên">
                        <ul class="pagination mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link text-dark" th:href="@{/api/staff/view-staff(page=${currentPage - 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, name=${name}, role=${role})}" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>
                            <li class="page-item" th:if="${currentPage > 2}">
                                <a class="page-link text-dark" th:href="@{/api/staff/view-staff(page=0, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, name=${name}, role=${role})}">1</a>
                            </li>
                            <li class="page-item disabled" th:if="${currentPage > 3}">
                                <span class="page-link text-dark">...</span>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(currentPage - 2 > 0 ? currentPage - 2 : 0, currentPage + 2 < totalPages - 1 ? currentPage + 2 : totalPages - 1)}">
                                <a class="page-link text-dark" th:href="@{/api/staff/view-staff(page=${i}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, name=${name}, role=${role})}" th:classappend="${i == currentPage} ? 'active'" th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item disabled" th:if="${currentPage < totalPages - 4}">
                                <span class="page-link text-dark">...</span>
                            </li>
                            <li class="page-item" th:if="${currentPage < totalPages - 3}">
                                <a class="page-link text-dark" th:href="@{/api/staff/view-staff(page=${totalPages - 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, name=${name}, role=${role})}" th:text="${totalPages}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link text-dark" th:href="@{/api/staff/view-staff(page=${currentPage + 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, name=${name}, role=${role})}" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                window.location.href = link.getAttribute('href');
            });
        });

        document.getElementById('clearFilters').addEventListener('click', () => {
            document.getElementById('searchName').value = '';
            document.getElementById('searchRole').value = '';
            window.location.href = '/api/staff/view-staff';
        });

        const currentPage = [[${currentPage}]];
        const pageSize = [[${pageSize}]];
        const sortBy = [[${sortBy}]];
        const sortDirection = [[${sortDirection}]];
        const name = [[${name}]] || '';
        const role = [[${role}]] || '';

        window.deleteStaff = function(id) {
            if (confirm('Bạn có chắc muốn xóa nhân viên này?')) {
                fetch(`/api/staff/delete/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        page: currentPage,
                        size: pageSize,
                        sortBy: sortBy,
                        sortDirection: sortDirection,
                        name: name,
                        role: role
                    })
                })
                    .then(response => {
                        if (response.ok) {
                            window.location.reload();
                        } else {
                            response.text().then(text => alert('Xóa thất bại: ' + (text || 'Lỗi không xác định')));
                        }
                    })
                    .catch(error => alert('Lỗi khi xóa nhân viên: ' + error.message));
            }
        };
    });
</script>
</body>
</html>
