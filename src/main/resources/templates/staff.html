<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÍ CỬA HÀNG THUỐC - Nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/medicine.css}">
</head>
<body>
    <div class="d-flex">
        <!-- Tích hợp sidebar chung -->
        <div th:replace="~{sidebar :: sidebar}"></div>

        <div class="flex-grow-1 bg-light p-4">
            <div class="container-fluid">
                <!-- Thay thế 3 summary cards này -->
<div class="row g-4 mb-4 justify-content-center">
    <div class="col-md-4">
        <div class="summary-card summary-card-1">
            <div class="position-relative z-10 text-center">
                <div class="text-sm opacity-80 mb-2">Tổng Số Nhân Viên</div>
                <div class="text-3xl font-bold" th:text="${totalStaff != null ? totalStaff : 0}"></div>
            </div>
            <i class="bi bi-person-fill position-absolute bottom-0 end-0 me-3 mb-3 opacity-50" style="font-size: 48px;"></i>
        </div>
    </div>
    <div class="col-md-4">
        <div class="summary-card summary-card-2">
            <div class="position-relative z-10 text-center">
                <div class="text-sm opacity-80 mb-2">Tổng Quản Lý</div>
                <div class="text-3xl font-bold" th:text="${totalManagers != null ? totalManagers : 0}"></div>
            </div>
            <i class="bi bi-person-badge position-absolute bottom-0 end-0 me-3 mb-3 opacity-50" style="font-size: 48px;"></i>
        </div>
    </div>
    <div class="col-md-4">
        <div class="summary-card summary-card-3">
            <div class="position-relative z-10 text-center">
                <div class="text-sm opacity-80 mb-2">Tổng Nhân Viên</div>
                <div class="text-3xl font-bold" th:text="${totalStaff != null && totalManagers != null ? totalStaff - totalManagers : 0}"></div>
            </div>
            <i class="bi bi-people position-absolute bottom-0 end-0 me-3 mb-3 opacity-50" style="font-size: 48px;"></i>
        </div>
    </div>
</div>

                <div class="filter-panel mb-4">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <i class="bi bi-funnel-fill text-secondary" style="font-size: 20px;"></i>
                        <h2 class="h5 mb-0">Bộ lọc</h2>
                    </div>
                    <form th:action="@{/api/staff/view-staff}" method="get">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">Tên nhân viên</label>
                                <input type="text" class="form-control" id="searchName" name="name" th:value="${name}" placeholder="Tên nhân viên">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Chức vụ</label>
                                <select class="form-select" id="role" name="role">
                                    <option value="">Chọn chức vụ</option>
                                    <option value="quan_ly" th:selected="${role == 'quan_ly'}">Quản lý</option>
                                    <option value="nhan_vien" th:selected="${role == 'nhan_vien'}">Nhân viên</option>
                                </select>
                            </div>
                            <div class="col-md-3 d-flex align-items-end gap-2">
                                <button class="btn btn-primary flex-grow-1 d-flex align-items-center justify-content-center gap-2" type="submit" id="filterButton">
                                    <i class="bi bi-search"></i> Lọc
                                </button>
                                <button class="btn btn-secondary flex-grow-1 d-flex align-items-center justify-content-center gap-2" type="button" id="clearFilters">
                                    <i class="bi bi-x"></i> Xóa Lọc
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="table-container">
                    <div class="p-4 d-flex justify-content-between align-items-center border-bottom">
                        <h2 class="h4">Danh sách nhân viên</h2>
                        <div class="d-flex gap-2">
                            <div class="dropdown">
                                <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" id="sortButton" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="bi bi-sort-down"></i> Sắp xếp
                                </button>
                                <ul class="dropdown-menu" aria-labelledby="sortButton">
                                    <li><a class="dropdown-item" th:href="@{/api/staff/view-staff(page=${currentPage}, size=${pageSize}, sortBy='name', sortDirection=${sortBy == 'name' and sortDirection == 'asc' ? 'desc' : 'asc'}, name=${name}, role=${role})}">Tên</a></li>
                                    <li><a class="dropdown-item" th:href="@{/api/staff/view-staff(page=${currentPage}, size=${pageSize}, sortBy='salary', sortDirection=${sortBy == 'salary' and sortDirection == 'asc' ? 'desc' : 'asc'}, name=${name}, role=${role})}">Lương</a></li>
                                </ul>
                            </div>
                            <button class="btn btn-success d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#addStaffModal" id="addButton"><i class="bi bi-plus"></i> Thêm nhân viên</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Tên</th>
                                    <th>Email</th>
                                    <th>SĐT</th>
                                    <th>Chức vụ</th>
                                    <th>Ca làm việc</th>
                                    <th>Lương</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="staff : ${staffs}">
                                    <td th:text="${staff.id}"></td>
                                    <td th:text="${staff.name}"></td>
                                    <td th:text="${staff.email}"></td>
                                    <td th:text="${staff.phone}"></td>
                                    <td th:text="${staff.role.displayName}"></td>
                                    <td th:text="${staff.workShift.displayName}"></td>
                                    <td th:text="${#numbers.formatDecimal(staff.salary, 0, 2, 'COMMA') + ' VNĐ'}"></td>
                                    <td>
                                        <div class="d-flex gap-2">
                                            <button class="btn btn-action-edit btn-sm text-white" th:onclick="'openEditModal(' + ${staff.id} + ')'"><i class="bi bi-pencil"></i></button>
                                            <button class="btn btn-action-delete btn-sm text-white" th:onclick="'deleteStaff(' + ${staff.id} + ')'"><i class="bi bi-trash"></i></button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${staffs == null or staffs.isEmpty()}">
                                    <td colspan="8" class="text-center">Không tìm thấy dữ liệu nhân viên nào.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="p-3 d-flex justify-content-center border-top" th:if="${totalPages > 1}">
                        <nav aria-label="Phân trang danh sách nhân viên">
                            <ul class="pagination mb-0">
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link text-dark" th:href="@{/api/staff/view-staff(page=${currentPage - 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, name=${name}, role=${role})}" aria-label="Previous">
                                        <span aria-hidden="true">&laquo;</span>
                                    </a>
                                </li>
                                <li class="page-item" th:if="${currentPage > 2}">
                                    <a class="page-link text-dark" th:href="@{/api/staff/view-staff(page=0, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, name=${name}, role=${role})}">1</a>
                                </li>
                                <li class="page-item disabled" th:if="${currentPage > 3}">
                                    <span class="page-link text-dark">...</span>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(currentPage - 2 > 0 ? currentPage - 2 : 0, currentPage + 2 < totalPages - 1 ? currentPage + 2 : totalPages - 1)}">
                                    <a class="page-link text-dark" th:href="@{/api/staff/view-staff(page=${i}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, name=${name}, role=${role})}" th:classappend="${i == currentPage} ? 'active'" th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item disabled" th:if="${currentPage < totalPages - 4}">
                                    <span class="page-link text-dark">...</span>
                                </li>
                                <li class="page-item" th:if="${currentPage < totalPages - 3}">
                                    <a class="page-link text-dark" th:href="@{/api/staff/view-staff(page=${totalPages - 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, name=${name}, role=${role})}" th:text="${totalPages}"></a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                    <a class="page-link text-dark" th:href="@{/api/staff/view-staff(page=${currentPage + 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, name=${name}, role=${role})}" aria-label="Next">
                                        <span aria-hidden="true">&raquo;</span>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Adding Staff -->
    <div class="modal fade" id="addStaffModal" tabindex="-1" aria-labelledby="addStaffModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addStaffModalLabel">Thêm nhân viên mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Hiển thị lỗi nếu có -->
                <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                    <span id="errorMessage"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Form thêm nhân viên -->
                <form id="addStaffForm">
                    <div class="mb-3">
                        <label for="staffName" class="form-label">Tên nhân viên</label>
                        <input type="text" class="form-control" id="staffName" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="staffEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="staffEmail" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="staffPhone" class="form-label">Số điện thoại</label>
                        <input type="text" class="form-control" id="staffPhone" name="phone" 
                               pattern="[0-9]{10,15}" placeholder="Nhập 10-15 chữ số" required>
                    </div>

                    <div class="mb-3">
                        <label for="staffRole" class="form-label">Chức vụ</label>
                        <select class="form-select" id="staffRole" name="role" required>
                            <option value="">Chọn chức vụ</option>
                            <option value="quan_ly">Quản lý</option>
                            <option value="nhan_vien">Nhân viên</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="staffWorkShift" class="form-label">Ca làm việc</label>
                        <select class="form-select" id="staffWorkShift" name="workShift" required>
                            <option value="">Chọn ca làm việc</option>
                            <option value="sang">Ca sáng</option>
                            <option value="chieu">Ca chiều</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="staffSalary" class="form-label">Lương (VNĐ)</label>
                        <input type="number" class="form-control" id="staffSalary" name="salary" 
                               step="0.01" min="0" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-plus"></i> Thêm nhân viên
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
    const addStaffForm = document.getElementById('addStaffForm');
    
    if (addStaffForm) {
        addStaffForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Lấy dữ liệu từ form
            const formData = {
                name: document.getElementById('staffName').value,
                email: document.getElementById('staffEmail').value,
                phone: document.getElementById('staffPhone').value,
                role: document.getElementById('staffRole').value,
                workShift: document.getElementById('staffWorkShift').value,
                salary: parseFloat(document.getElementById('staffSalary').value)
            };
            
            // Gửi request POST với JSON
            fetch('/api/staff/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else if (response.status === 409) {
                    throw new Error('Email hoặc Số điện thoại đã tồn tại');
                } else if (response.status === 400) {
                    throw new Error('Dữ liệu không hợp lệ');
                } else {
                    throw new Error('Lỗi server');
                }
            })
            .then(data => {
                addStaffForm.reset();
                const modal = bootstrap.Modal.getInstance(document.getElementById('addStaffModal'));
                if (modal) modal.hide();
                window.location.reload();
            })
            .catch(error => {
                const errorAlert = document.getElementById('errorAlert');
                const errorMessage = document.getElementById('errorMessage');
                errorMessage.textContent = error.message || 'Lỗi khi thêm nhân viên';
                errorAlert.classList.remove('d-none');
            });
        });
    }
});
        document.addEventListener('DOMContentLoaded', () => {
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    navLinks.forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                    window.location.href = link.getAttribute('href');
                });
            });

            document.getElementById('clearFilters').addEventListener('click', () => {
                document.getElementById('searchName').value = '';
                document.getElementById('role').value = '';
                window.location.href = '/api/staff/view-staff';
            });

            window.deleteStaff = function(id) {
                if (confirm('Bạn có chắc muốn xóa nhân viên này?')) {
                    fetch(`/api/staff/delete/${id}`, { method: 'DELETE' })
                        .then(response => {
                            if (response.ok) {
                                window.location.reload();
                            } else {
                                response.json().then(data => alert(data.message || 'Xóa thất bại!'));
                            }
                        });
                }
            };

            window.openEditModal = function(id) {
                fetch(`/api/staff/list?page=0&size=1`)
                    .then(response => response.json())
                    .then(data => {
                        const staff = data.content.find(s => s.id === id);
                        if (!staff) {
                            alert('Không tìm thấy nhân viên!');
                            return;
                        }
                        const modal = document.createElement('div');
                        modal.className = 'modal fade';
                        modal.id = 'editStaffModal';
                        modal.innerHTML = `
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title">Sửa thông tin nhân viên</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <div class="modal-body">
                                        <form id="editStaffForm" action="/api/staff/update/${id}" method="post">
                                            <input type="hidden" name="id" value="${staff.id}">
                                            <div class="mb-3">
                                                <label for="editName" class="form-label">Tên nhân viên</label>
                                                <input type="text" class="form-control" id="editName" name="name" value="${staff.name}" required>
                                            </div>
                                            <div class="mb-3">
                                                <label for="editEmail" class="form-label">Email</label>
                                                <input type="email" class="form-control" id="editEmail" name="email" value="${staff.email}" required>
                                            </div>
                                            <div class="mb-3">
                                                <label for="editPhone" class="form-label">Số điện thoại</label>
                                                <input type="text" class="form-control" id="editPhone" name="phone" value="${staff.phone}" pattern="[0-9]{10,15}" required>
                                            </div>
                                            <div class="mb-3">
                                                <label for="editRole" class="form-label">Chức vụ</label>
                                                <select class="form-select" id="editRole" name="role" required>
                                                    <option value="quan_ly" ${staff.role === 'quan_ly' ? 'selected' : ''}>Quản lý</option>
                                                    <option value="nhan_vien" ${staff.role === 'nhan_vien' ? 'selected' : ''}>Nhân viên</option>
                                                </select>
                                            </div>
                                            <div class="mb-3">
                                                <label for="editWorkShift" class="form-label">Ca làm việc</label>
                                                <select class="form-select" id="editWorkShift" name="workShift" required>
                                                    <option value="sang" ${staff.workShift === 'sang' ? 'selected' : ''}>Ca sáng</option>
                                                    <option value="chieu" ${staff.workShift === 'chieu' ? 'selected' : ''}>Ca chiều</option>
                                                </select>
                                            </div>
                                            <div class="mb-3">
                                                <label for="editSalary" class="form-label">Lương</label>
                                                <input type="number" class="form-control" id="editSalary" name="salary" step="0.01" value="${staff.salary}" required>
                                            </div>
                                            <button type="submit" class="btn btn-primary">Cập nhật</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        `;
                        document.body.appendChild(modal);
                        const bootstrapModal = new bootstrap.Modal(modal);
                        bootstrapModal.show();
                        modal.addEventListener('hidden.bs.modal', () => modal.remove());
                        document.getElementById('editStaffForm').addEventListener('submit', (e) => {
                            e.preventDefault();
                            const formData = new FormData(e.target);
                            fetch(e.target.action, {
                                method: 'PUT',
                                body: JSON.stringify(Object.fromEntries(formData)),
                                headers: { 'Content-Type': 'application/json' }
                            })
                            .then(response => {
                                if (response.ok) {
                                    window.location.reload();
                                } else {
                                    response.json().then(data => alert(data.message || 'Cập nhật thất bại!'));
                                }
                            });
                        });
                    });
            };
        });
    </script>
</body>
</html>
