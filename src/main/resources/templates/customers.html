<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ CỬA HÀNG THUỐC - Khách Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/medicine.css}">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{sidebar :: sidebar}"></div>

    <div class="flex-grow-1 bg-light p-4">
        <div class="container-fluid">
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${message != null}" class="alert alert-success" th:text="${message}"></div>

            <div class="row g-4 mb-4 justify-content-center">
                <div class="col-md-4">
                    <div class="summary-card summary-card-1">
                        <div class="position-relative z-10 text-center">
                            <div class="text-sm opacity-80 mb-2">Tổng Số Khách Hàng</div>
                            <div class="text-3xl font-bold" th:text="${totalCustomers != null ? totalCustomers : 0}"></div>
                        </div>
                        <i class="bi bi-person-fill position-absolute bottom-0 end-0 me-3 mb-3 opacity-50" style="font-size: 48px;"></i>
                    </div>
                </div>
            </div>

            <div class="filter-panel mb-4">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <i class="bi bi-funnel-fill text-secondary" style="font-size: 20px;"></i>
                    <h2 class="h5 mb-0">Bộ lọc</h2>
                </div>
                <form th:action="@{/customers/view-customers}" method="get">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Tên khách hàng</label>
                            <input type="text" class="form-control" id="keyword" name="keyword" th:value="${keyword}" placeholder="Tên khách hàng">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control" id="phone" name="phone" th:value="${phone}" placeholder="Số điện thoại">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Loại khách hàng</label>
                            <select class="form-select" id="customerType" name="customerType">
                                <option value="">Loại khách hàng</option>
                                <option value="vang_lai" th:selected="${customerType == 'vang_lai'}">Vãng lai</option>
                                <option value="than_thiet" th:selected="${customerType == 'than_thiet'}">Thân thiết</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end gap-2">
                            <button class="btn btn-primary flex-grow-1 d-flex align-items-center justify-content-center gap-2" type="submit" id="filterButton">
                                <i class="bi bi-search"></i> Lọc
                            </button>
                            <button class="btn btn-secondary flex-grow-1 d-flex align-items-center justify-content-center gap-2" type="button" id="clearFilters">
                                <i class="bi bi-x"></i> Xóa Lọc
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <div class="p-4 d-flex justify-content-between align-items-center border-bottom">
                    <h2 class="h4">Danh sách khách hàng</h2>
                    <div class="d-flex gap-2">
                        <div class="dropdown">
                            <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="sortDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                Sắp xếp
                            </button>
                            <ul class="dropdown-menu" aria-labelledby="sortDropdown">
                                <li><a class="dropdown-item" th:href="@{/customers/view-customers(page=${currentPage}, size=${pageSize}, sortBy='name', sortDirection='asc', keyword=${keyword}, phone=${phone}, customerType=${customerType})}">Tên A-Z</a></li>
                                <li><a class="dropdown-item" th:href="@{/customers/view-customers(page=${currentPage}, size=${pageSize}, sortBy='name', sortDirection='desc', keyword=${keyword}, phone=${phone}, customerType=${customerType})}">Tên Z-A</a></li>
                                <li><a class="dropdown-item" th:href="@{/customers/view-customers(page=${currentPage}, size=${pageSize}, sortBy='rewardPoints', sortDirection='asc', keyword=${keyword}, phone=${phone}, customerType=${customerType})}">Điểm thưởng tăng dần</a></li>
                                <li><a class="dropdown-item" th:href="@{/customers/view-customers(page=${currentPage}, size=${pageSize}, sortBy='rewardPoints', sortDirection='desc', keyword=${keyword}, phone=${phone}, customerType=${customerType})}">Điểm thưởng giảm dần</a></li>
                            </ul>
                        </div>
                        <a class="btn btn-success d-flex align-items-center gap-2" th:href="@{/customers/add}" th:if="${isManager}">
                            <i class="bi bi-plus"></i> Thêm mới khách hàng
                        </a>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>
                                Tên
                                <a th:href="@{/customers/view-customers(page=${currentPage}, size=${pageSize}, sortBy='name', sortDirection=${sortBy == 'name' and sortDirection == 'asc' ? 'desc' : 'asc'}, keyword=${keyword}, phone=${phone}, customerType=${customerType})}">
                                    <i th:class="${sortBy == 'name'} ? (${sortDirection == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up'"></i>
                                </a>
                            </th>
                            <th>SĐT</th>
                            <th>Email</th>
                            <th>
                                Loại khách hàng
                                <a th:href="@{/customers/view-customers(page=${currentPage}, size=${pageSize}, sortBy='customerType', sortDirection=${sortBy == 'customerType' and sortDirection == 'asc' ? 'desc' : 'asc'}, keyword=${keyword}, phone=${phone}, customerType=${customerType})}">
                                    <i th:class="${sortBy == 'customerType'} ? (${sortDirection == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up'"></i>
                                </a>
                            </th>
                            <th>
                                Điểm thưởng
                                <a th:href="@{/customers/view-customers(page=${currentPage}, size=${pageSize}, sortBy='rewardPoints', sortDirection=${sortBy == 'rewardPoints' and sortDirection == 'asc' ? 'desc' : 'asc'}, keyword=${keyword}, phone=${phone}, customerType=${customerType})}">
                                    <i th:class="${sortBy == 'rewardPoints'} ? (${sortDirection == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up'"></i>
                                </a>
                            </th>
                            <th th:if="${isManager}">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="customer : ${customers}">
                            <td th:text="${customer.id}"></td>
                            <td th:text="${customer.name}"></td>
                            <td th:text="${customer.phone}"></td>
                            <td th:text="${customer.email}"></td>
                            <td th:text="${customer.customerType != null ? customer.customerType.getDisplayName() : 'N/A'}"></td>
                            <td th:text="${customer.rewardPoints != null ? customer.rewardPoints : '0'}"></td>
                            <td th:if="${isManager}">
                                <div class="d-flex gap-2">
                                    <a class="btn btn-primary btn-sm btn-action-edit text-white" th:href="@{/customers/edit/{id}(id=${customer.id}, page=${currentPage}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, keyword=${keyword}, phone=${phone}, customerType=${customerType})}"><i class="bi bi-pencil"></i></a>
                                    <button class="btn btn-danger btn-sm btn-action-delete text-white" th:onclick="'deleteCustomer(' + ${customer.id} + ')'"><i class="bi bi-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${customers == null or customers.isEmpty()}">
                            <td colspan="7" class="text-center">Không tìm thấy dữ liệu khách hàng nào.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-3 d-flex justify-content-center border-top" th:if="${totalPages > 1}">
                    <nav aria-label="Phân trang danh sách khách hàng">
                        <ul class="pagination mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link text-dark" th:href="@{/customers/view-customers(page=${currentPage - 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, keyword=${keyword}, phone=${phone}, customerType=${customerType})}" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>
                            <li class="page-item" th:if="${currentPage > 2}">
                                <a class="page-link text-dark" th:href="@{/customers/view-customers(page=0, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, keyword=${keyword}, phone=${phone}, customerType=${customerType})}">1</a>
                            </li>
                            <li class="page-item disabled" th:if="${currentPage > 3}">
                                <span class="page-link text-dark">...</span>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(currentPage - 2 > 0 ? currentPage - 2 : 0, currentPage + 2 < totalPages - 1 ? currentPage + 2 : totalPages - 1)}">
                                <a class="page-link text-dark" th:href="@{/customers/view-customers(page=${i}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, keyword=${keyword}, phone=${phone}, customerType=${customerType})}" th:classappend="${i == currentPage} ? 'active'" th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item disabled" th:if="${currentPage < totalPages - 4}">
                                <span class="page-link text-dark">...</span>
                            </li>
                            <li class="page-item" th:if="${currentPage < totalPages - 3}">
                                <a class="page-link text-dark" th:href="@{/customers/view-customers(page=${totalPages - 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, keyword=${keyword}, phone=${phone}, customerType=${customerType})}" th:text="${totalPages}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link text-dark" th:href="@{/customers/view-customers(page=${currentPage + 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, keyword=${keyword}, phone=${phone}, customerType=${customerType})}" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                window.location.href = link.getAttribute('href');
            });
        });

        document.getElementById('clearFilters').addEventListener('click', () => {
            document.getElementById('keyword').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('customerType').value = '';
            // Nhúng các giá trị từ Thymeleaf vào JavaScript
            const currentPage = [[${currentPage}]];
            const pageSize = [[${pageSize}]];
            const sortBy = [[${sortBy}]];
            const sortDirection = [[${sortDirection}]];

            // Xây dựng URL với các tham số phân trang và sắp xếp, nhưng không giữ bộ lọc
            let url = '/customers/view-customers';
            const params = new URLSearchParams();
            if (currentPage !== 0) params.append('page', currentPage);
            if (pageSize !== 10) params.append('size', pageSize); // Giả sử mặc định là 10
            if (sortBy !== 'id') params.append('sortBy', sortBy); // Giả sử mặc định là 'id'
            if (sortDirection !== 'asc') params.append('sortDirection', sortDirection); // Giả sử mặc định là 'asc'
            if (params.toString()) {
                url += '?' + params.toString();
            }
            window.location.href = url;
        });

        window.deleteCustomer = function(id) {
            if (confirm('Bạn có chắc muốn xóa khách hàng này?')) {
                fetch(`/customers/delete/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        page: [[${currentPage}]],
                        size: [[${pageSize}]],
                        sortBy: [[${sortBy}]],
                        sortDirection: [[${sortDirection}]],
                        keyword: [[${keyword}]] || '',
                        phone: [[${phone}]] || '',
                        customerType: [[${customerType}]] || ''
                    })
                })
                    .then(response => {
                        if (response.ok) {
                            window.location.reload();
                        } else {
                            response.text().then(text => alert('Xóa thất bại: ' + (text || 'Lỗi không xác định')));
                        }
                    })
                    .catch(error => alert('Lỗi khi xóa khách hàng: ' + error.message));
            }
        };
    });
</script>
</body>
</html>
