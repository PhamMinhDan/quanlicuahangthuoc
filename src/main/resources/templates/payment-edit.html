<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUẢN LÝ CỬA HÀNG THUỐC - Sửa Thanh Toán</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/medicine.css}">
</head>
<body>
<div class="d-flex">
  <div th:replace="~{sidebar :: sidebar}"></div>

  <div class="flex-grow-1 bg-light p-4">
    <div class="container-fluid">
      <h2 class="h4 mb-4">Sửa Thanh Toán</h2>
      <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
      <div th:if="${message != null}" class="alert alert-success" th:text="${message}"></div>

      <form th:action="@{/payments/update/{id}(id=${payment.id})}" method="post" th:object="${payment}">
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="orderId" class="form-label">Mã đơn <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="orderId" th:field="*{order.id}" required min="1" placeholder="Nhập mã đơn">
            <div class="invalid-feedback" th:errors="*{order.id}"></div>
          </div>
          <div class="col-md-6">
            <label for="paymentMethod" class="form-label">Phương thức thanh toán <span class="text-danger">*</span></label>
            <select class="form-select" id="paymentMethod" th:field="*{paymentMethod}" required>
              <option value="">Chọn phương thức</option>
              <option th:each="method : ${T(com.example.quanlicuahangthuoc.entity.Payment.PaymentMethod).values()}"
                      th:value="${method}" th:text="${method.displayName}"
                      th:selected="${payment.paymentMethod == method}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{paymentMethod}"></div>
          </div>
          <div class="col-md-6">
            <label for="amount" class="form-label">Số tiền <span class="text-danger">*</span></label>
            <input type="number" step="0.01" class="form-control" id="amount" th:field="*{amount}" required min="0" placeholder="Nhập số tiền (VNĐ)">
            <div class="invalid-feedback" th:errors="*{amount}"></div>
          </div>
          <div class="col-md-6">
            <label for="change" class="form-label">Tiền thừa</label>
            <input type="number" step="0.01" class="form-control" id="change" th:field="*{change}" min="0" placeholder="Nhập tiền thừa (VNĐ)">
            <div class="invalid-feedback" th:errors="*{change}"></div>
          </div>
          <div class="col-md-6">
            <label for="paymentDate" class="form-label">Ngày thanh toán <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="paymentDate" th:field="*{paymentDate}" required>
            <div class="invalid-feedback" th:errors="*{paymentDate}"></div>
          </div>
        </div>
        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary d-flex align-items-center gap-2">
            <i class="bi bi-save"></i> Lưu
          </button>
          <a th:href="@{/payments/view-payments(page=${page}, size=${size}, sortField=${sortField}, sortDir=${sortDir}, orderId=${orderId}, paymentDate=${paymentDate})}"
             class="btn btn-secondary d-flex align-items-center gap-2">
            <i class="bi bi-x"></i> Hủy
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.querySelector('form');
    form.addEventListener('submit', (e) => {
      if (!form.checkValidity()) {
        e.preventDefault();
        form.classList.add('was-validated');
      }
    });
  });
</script>
</body>
</html>
