<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ CỬA HÀNG THUỐC - Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/login.css}">
</head>
<body>
<div class="min-vh-100 bg-gradient d-flex flex-column">
    <!-- Header -->
    <header class="w-100 bg-white shadow-sm py-4 px-3">
        <div class="d-flex align-items-center gap-3">
            <img th:src="@{/images/logo_medicine.png}" alt="Logo" class="img-fluid" style="max-height: 40px;" />
            <div>
                <h1 class="fs-4 fw-bold text-dark">QUẢN LÝ CỬA HÀNG THUỐC</h1>
            </div>
        </div>
    </header>

    <!-- Main Login Area -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center px-3 py-5">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="bg-white rounded-3 shadow-lg p-5 border">
                <h2 class="fs-3 fw-bold text-center text-dark mb-2">Đăng nhập hệ thống</h2>
                <p class="text-center text-muted mb-4">Vui lòng nhập thông tin để tiếp tục</p>

                <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
                <div th:if="${message != null}" class="alert alert-success" th:text="${message}"></div>

                <form th:action="@{/login}" method="post" class="d-flex flex-column gap-4">
                    <!-- Username Field -->
                    <div>
                        <label for="username" class="form-label text-dark small fw-medium">Email</label>
                        <div class="position-relative">
                                <span class="position-absolute top-50 start-0 translate-middle-y ps-4">
                                    <i class="bi bi-person text-muted"></i>
                                </span>
                            <input type="email" id="username" name="username" class="form-control ps-5 py-2 rounded-3" placeholder="Nhập email" required />
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label for="password" class="form-label text-dark small fw-medium">Mật khẩu</label>
                        <div class="position-relative">
                                <span class="position-absolute top-50 start-0 translate-middle-y ps-4">
                                    <i class="bi bi-lock text-muted"></i>
                                </span>
                            <input type="password" id="password" name="password" class="form-control ps-5 py-2 rounded-3" placeholder="Nhập mật khẩu" required />
                        </div>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3">Đăng nhập</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-100 bg-white border-top py-4 px-3">
        <div class="container text-center">
            <p class="text-muted small mb-2">© 2025 QUẢN LÝ CỬA HÀNG THUỐC. Mọi quyền được bảo lưu.</p>
            <div class="d-flex justify-content-center gap-3 text-muted" style="font-size: 0.75rem;">
                <a href="#" class="text-muted text-decoration-none hover-text-success">Điều khoản sử dụng</a>
                <span>|</span>
                <a href="#" class="text-muted text-decoration-none hover-text-success">Chính sách bảo mật</a>
            </div>
        </div>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
