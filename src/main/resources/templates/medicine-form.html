<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ CỬA HÀNG THUỐC - Thêm/Sửa Thuốc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" th:href="@{/medicine.css}">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{sidebar :: sidebar}"></div>

    <div class="main-content flex-grow-1 bg-light p-4">
        <div class="container-fluid">
            <h2 class="h4 mb-4" th:text="${medicine.id != null} ? 'Sửa Thuốc' : 'Thêm Thuốc Mới'"></h2>
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${message != null}" class="alert alert-success" th:text="${message}"></div>

            <form th:action="${medicine.id != null} ? @{/medicines/update/{id}(id=${medicine.id})} : @{/medicines/add}"
                  th:object="${medicine}"
                  method="post"
                  enctype="multipart/form-data">
                <input type="hidden" name="page" th:value="${page}">
                <input type="hidden" name="size" th:value="${size}">
                <input type="hidden" name="sortBy" th:value="${sortBy}">
                <input type="hidden" name="sortDirection" th:value="${sortDirection}">
                <input type="hidden" name="searchName" th:value="${searchName}">
                <input type="hidden" name="searchType" th:value="${searchType}">
                <input type="hidden" name="searchSupplier" th:value="${searchSupplier}">
                <div class="mb-3">
                    <label for="name" class="form-label">Tên thuốc</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" 
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label for="type" class="form-label">Loại thuốc</label>
                    <select class="form-select" id="type" th:field="*{type}" 
                            th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'" required>
                        <option value="giam_dau">Giảm đau</option>
                        <option value="khang_sinh">Kháng sinh</option>
                        <option value="chong_viem">Chống viêm</option>
                        <option value="thuoc_ha_huyet_ap">Thuốc hạ huyết áp</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                </div>
                <div class="mb-3">
                    <label for="expiryDate" class="form-label">Ngày hết hạn</label>
                    <input type="text" class="form-control" id="expiryDateDisplay" 
                           th:classappend="${#fields.hasErrors('expiryDate')} ? 'is-invalid'"
                           placeholder="dd/MM/yyyy" required>
                    <input type="hidden" id="expiryDate" th:field="*{expiryDate}">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('expiryDate')}" th:errors="*{expiryDate}"></div>
                </div>
                <div class="mb-3">
                    <label for="price" class="form-label">Giá</label>
                    <input type="number" class="form-control" id="price" th:field="*{price}" 
                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'" step="0.01" min="0" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>
                <div class="mb-3">
                    <label for="stockQuantity" class="form-label">Số lượng tồn kho</label>
                    <input type="number" class="form-control" id="stockQuantity" th:field="*{stockQuantity}" 
                           th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid'" min="0" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
                </div>
                <div class="mb-3">
                    <label for="supplier" class="form-label">Nhà cung cấp</label>
                    <select class="form-select" id="supplier" th:field="*{supplier}" 
                            th:classappend="${#fields.hasErrors('supplier')} ? 'is-invalid'" required>
                        <option value="Pfizer">Pfizer</option>
                        <option value="Novartis">Novartis</option>
                        <option value="Johnson">Johnson</option>
                        <option value="Roche">Roche</option>
                        <option value="Merck">Merck</option>
                        <option value="Sanofi">Sanofi</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('supplier')}" th:errors="*{supplier}"></div>
                </div>
                <div class="mb-3">
                    <label for="usageInstructions" class="form-label">Hướng dẫn sử dụng</label>
                    <textarea class="form-control" id="usageInstructions" th:field="*{usageInstructions}" rows="4" placeholder="Nhập hướng dẫn sử dụng thuốc..."></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('usageInstructions')}" th:errors="*{usageInstructions}"></div>
                </div>
                <div class="mb-3">
                    <label for="imageFile" class="form-label">Hình ảnh</label>
                    <input type="file" class="form-control" id="imageFile" name="imageFile">
                    <div th:if="${medicine.image != null}">
                        <img th:src="${medicine.image}" th:onerror="this.src='/images/default-medicine.jpg'"
                             alt="Current Image" class="img-fluid rounded mt-2"
                             style="width: 100px; height: 100px; object-fit: cover;">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Lưu</button>
                <a class="btn btn-secondary" th:href="@{/medicines/view-medicine(page=${page}, size=${size}, sortBy=${sortBy}, sortDirection=${sortDirection}, searchName=${searchName}, searchType=${searchType}, searchSupplier=${searchSupplier})}">Hủy</a>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const expiryDateDisplay = document.getElementById('expiryDateDisplay');
        const expiryDateHidden = document.getElementById('expiryDate');
        
        if (expiryDateDisplay && expiryDateHidden) {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            // Get existing value from hidden input (format: yyyy-MM-dd)
            let existingValue = expiryDateHidden.value;
            
            const fp = flatpickr(expiryDateDisplay, {
                dateFormat: "d/m/Y",
                locale: "vn",
                minDate: tomorrow,
                allowInput: false,
                disableMobile: true,
                defaultDate: existingValue ? existingValue : null,
                onChange: function(selectedDates, dateStr, instance) {
                    if (selectedDates.length > 0) {
                        const date = selectedDates[0];
                        const year = date.getFullYear();
                        const month = String(date.getMonth() + 1).padStart(2, '0');
                        const day = String(date.getDate()).padStart(2, '0');
                        // Set hidden input to yyyy-MM-dd format for Spring Boot
                        expiryDateHidden.value = `${year}-${month}-${day}`;
                        
                        // Remove validation error if exists
                        expiryDateDisplay.classList.remove('is-invalid');
                    }
                }
            });
            
            // Validate on form submit
            const form = expiryDateDisplay.closest('form');
            if (form) {
                form.addEventListener('submit', function(e) {
                    if (!expiryDateHidden.value) {
                        expiryDateDisplay.classList.add('is-invalid');
                        e.preventDefault();
                    }
                });
            }
        }
    });
    </script>
    <div th:replace="~{footer :: footer}"></div>
</body>
</html>
