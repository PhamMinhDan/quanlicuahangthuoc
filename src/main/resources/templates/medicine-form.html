<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ CỬA HÀNG THUỐC - Thêm/Sửa Thuốc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" th:href="@{/medicine.css}">
    <link rel="stylesheet" th:href="@{/notification.css}">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{sidebar :: sidebar}"></div>

    <div class="main-content flex-grow-1 bg-light p-4">
        <div class="container-fluid">
            <h2 class="h4 mb-4">
                <i class="bi bi-capsule-pill"></i>
                <span th:text="${medicine.id != null} ? 'Sửa Thuốc' : 'Thêm Thuốc Mới'"></span>
            </h2>

            <form th:action="${medicine.id != null} ? @{/medicines/update/{id}(id=${medicine.id})} : @{/medicines/add}"
                  th:object="${medicine}"
                  method="post"
                  enctype="multipart/form-data"
                  class="needs-validation"
                  novalidate
                  th:if="${medicine != null}">

                <!-- Hidden fields để giữ lại tham số phân trang và lọc -->
                <input type="hidden" name="page" th:value="${page}">
                <input type="hidden" name="size" th:value="${size}">
                <input type="hidden" name="sortBy" th:value="${sortBy}">
                <input type="hidden" name="sortDirection" th:value="${sortDirection}">
                <input type="hidden" name="searchName" th:value="${searchName}">
                <input type="hidden" name="searchType" th:value="${searchType}">
                <input type="hidden" name="searchSupplier" th:value="${searchSupplier}">

                <div class="row">
                    <div class="col-md-6">
                        <!-- Tên thuốc -->
                        <div class="mb-3">
                            <label for="name" class="form-label">
                                <i class="bi bi-capsule"></i> Tên thuốc <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="name"
                                   th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   placeholder="Nhập tên thuốc..."
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <!-- Loại thuốc -->
                        <div class="mb-3">
                            <label for="type" class="form-label">
                                <i class="bi bi-tag"></i> Loại thuốc <span class="text-danger">*</span>
                            </label>
                            <select class="form-select"
                                    id="type"
                                    th:field="*{type}"
                                    th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'"
                                    required>
                                <option value="">-- Chọn loại thuốc --</option>
                                <option value="giam_dau" th:selected="${medicine.type?.name() == 'giam_dau'}">Giảm đau</option>
                                <option value="khang_sinh" th:selected="${medicine.type?.name() == 'khang_sinh'}">Kháng sinh</option>
                                <option value="chong_viem" th:selected="${medicine.type?.name() == 'chong_viem'}">Chống viêm</option>
                                <option value="thuoc_ha_huyet_ap" th:selected="${medicine.type?.name() == 'thuoc_ha_huyet_ap'}">Thuốc hạ huyết áp</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                        </div>

                        <!-- Ngày hết hạn -->
                        <div class="mb-3">
                            <label for="expiryDate" class="form-label">
                                <i class="bi bi-calendar-event"></i> Ngày hết hạn <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="expiryDateDisplay"
                                   th:classappend="${#fields.hasErrors('expiryDate')} ? 'is-invalid'"
                                   placeholder="dd/MM/yyyy"
                                   required
                                   readonly>
                            <!-- Hidden input để submit về server -->
                            <input type="hidden"
                                   id="expiryDate"
                                   name="expiryDate"
                                   th:value="${medicine.expiryDate != null ? #temporals.format(medicine.expiryDate, 'yyyy-MM-dd') : ''}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('expiryDate')}" th:errors="*{expiryDate}"></div>
                            <small class="text-muted" th:if="${medicine.id == null}">* Chỉ được chọn từ ngày mai trở đi</small>
                        </div>

                        <!-- Giá -->
                        <div class="mb-3">
                            <label for="price" class="form-label">
                                <i class="bi bi-cash"></i> Giá (VNĐ) <span class="text-danger">*</span>
                            </label>
                            <input type="number"
                                   class="form-control"
                                   id="price"
                                   th:field="*{price}"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                                   step="1000"
                                   min="0"
                                   placeholder="Nhập giá thuốc..."
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <!-- Số lượng tồn kho -->
                        <div class="mb-3">
                            <label for="stockQuantity" class="form-label">
                                <i class="bi bi-box-seam"></i> Số lượng tồn kho <span class="text-danger">*</span>
                            </label>
                            <input type="number"
                                   class="form-control"
                                   id="stockQuantity"
                                   th:field="*{stockQuantity}"
                                   th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid'"
                                   min="0"
                                   placeholder="Nhập số lượng..."
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
                        </div>

                        <!-- Nhà cung cấp -->
                        <div class="mb-3">
                            <label for="supplier" class="form-label">
                                <i class="bi bi-building"></i> Nhà cung cấp <span class="text-danger">*</span>
                            </label>
                            <select class="form-select"
                                    id="supplier"
                                    th:field="*{supplier}"
                                    th:classappend="${#fields.hasErrors('supplier')} ? 'is-invalid'"
                                    required>
                                <option value="">-- Chọn nhà cung cấp --</option>
                                <option value="Pfizer" th:selected="${medicine.supplier?.name() == 'Pfizer'}">Pfizer</option>
                                <option value="Novartis" th:selected="${medicine.supplier?.name() == 'Novartis'}">Novartis</option>
                                <option value="Johnson" th:selected="${medicine.supplier?.name() == 'Johnson'}">Johnson</option>
                                <option value="Roche" th:selected="${medicine.supplier?.name() == 'Roche'}">Roche</option>
                                <option value="Merck" th:selected="${medicine.supplier?.name() == 'Merck'}">Merck</option>
                                <option value="Sanofi" th:selected="${medicine.supplier?.name() == 'Sanofi'}">Sanofi</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('supplier')}" th:errors="*{supplier}"></div>
                        </div>

                        <!-- Hình ảnh -->
                        <div class="mb-3">
                            <label for="imageFile" class="form-label">
                                <i class="bi bi-image"></i> Hình ảnh
                            </label>
                            <input type="file"
                                   class="form-control"
                                   id="imageFile"
                                   name="imageFile"
                                   accept="image/*">
                            <small class="text-muted">Định dạng: JPG, PNG, GIF (tối đa 5MB)</small>

                            <!-- Hiển thị ảnh hiện tại nếu có -->
                            <div th:if="${medicine.image != null and medicine.image != ''}" class="mt-2">
                                <p class="mb-1 fw-bold">Ảnh hiện tại:</p>
                                <img th:src="${medicine.image}"
                                     th:onerror="this.src='/images/default-medicine.jpg'"
                                     alt="Current Image"
                                     class="img-thumbnail"
                                     style="width: 150px; height: 150px; object-fit: cover;">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Hướng dẫn sử dụng -->
                <div class="mb-3">
                    <label for="usageInstructions" class="form-label">
                        <i class="bi bi-journal-text"></i> Hướng dẫn sử dụng
                    </label>
                    <textarea class="form-control"
                              id="usageInstructions"
                              th:field="*{usageInstructions}"
                              rows="4"
                              placeholder="Nhập hướng dẫn sử dụng thuốc..."></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('usageInstructions')}" th:errors="*{usageInstructions}"></div>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i>
                        <span th:text="${medicine.id != null} ? 'Cập nhật' : 'Thêm mới'"></span>
                    </button>
                    <a class="btn btn-secondary"
                       th:href="@{/medicines/view-medicine(page=${page}, size=${size}, sortBy=${sortBy}, sortDirection=${sortDirection}, searchName=${searchName != null ? searchName : ''}, searchType=${searchType != null ? searchType : ''}, searchSupplier=${searchSupplier != null ? searchSupplier : ''})}">
                        <i class="bi bi-x-circle"></i> Hủy
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>
<script th:src="@{/notification.js}"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const expiryDateDisplay = document.getElementById('expiryDateDisplay');
        const expiryDateHidden = document.getElementById('expiryDate');

        const isEditMode = /*[[${medicine.id != null}]]*/ false;
        const existingDateStr = /*[[${medicine.expiryDate != null ? #temporals.format(medicine.expiryDate, 'yyyy-MM-dd') : ''}]]*/ '';

        if (expiryDateDisplay && expiryDateHidden) {
            const today = new Date();
            let minDate = null;

            if (!isEditMode) {
                minDate = new Date(today);
                minDate.setDate(today.getDate() + 1);
            }

            let defaultDate = null;
            if (existingDateStr) {
                const [year, month, day] = existingDateStr.split('-');
                defaultDate = new Date(year, month - 1, day);
            }

            console.log('isEditMode:', isEditMode);
            console.log('existingDateStr:', existingDateStr);
            console.log('defaultDate:', defaultDate);
            console.log('minDate:', minDate);

            const fp = flatpickr(expiryDateDisplay, {
                dateFormat: "d/m/Y",
                locale: "vn",
                minDate: minDate,
                allowInput: false,
                disableMobile: true,
                defaultDate: defaultDate,
                onChange: function(selectedDates, dateStr, instance) {
                    if (selectedDates.length > 0) {
                        const date = selectedDates[0];
                        const year = date.getFullYear();
                        const month = String(date.getMonth() + 1).padStart(2, '0');
                        const day = String(date.getDate()).padStart(2, '0');
                        expiryDateHidden.value = `${year}-${month}-${day}`;
                        expiryDateDisplay.classList.remove('is-invalid');
                    }
                },
                onReady: function(selectedDates, dateStr, instance) {
                    console.log('Flatpickr ready');
                    console.log('Selected dates:', selectedDates);
                    console.log('Date string:', dateStr);
                    console.log('Hidden input value:', expiryDateHidden.value);
                }
            });

            const form = expiryDateDisplay.closest('form');
            if (form) {
                form.addEventListener('submit', function(e) {
                    let isValid = true;
                    if (!expiryDateHidden.value || expiryDateHidden.value.trim() === '') {
                        expiryDateDisplay.classList.add('is-invalid');
                        isValid = false;
                        if (typeof notification !== 'undefined') {
                            notification.showError('Vui lòng chọn ngày hết hạn!');
                        }
                    }
                    if (!isValid) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    form.classList.add('was-validated');
                });
            }
        }

        const errorMessage = /*[[${error}]]*/ null;
        const successMessage = /*[[${message}]]*/ null;

        if (errorMessage && typeof notification !== 'undefined') {
            notification.showError(errorMessage);
        }
        if (successMessage && typeof notification !== 'undefined') {
            notification.showSuccess(successMessage);
        }
    });
</script>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
