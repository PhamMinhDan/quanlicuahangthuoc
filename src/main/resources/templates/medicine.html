<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ CỬA HÀNG THUỐC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/medicine.css}">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{sidebar :: sidebar}"></div>

    <div class="main-content flex-grow-1 bg-light p-4">
        <div class="container-fluid">
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${message != null}" class="alert alert-success" th:text="${message}"></div>

            <!-- Tiêu đề trang -->
            <div class="mb-4">
                <h1 class="display-6 fw-bold text-primary">
                    <i class="bi bi-capsule"></i> DANH SÁCH THUỐC
                </h1>
            </div>

            <div class="filter-panel mb-4">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <i class="bi bi-funnel-fill text-secondary" style="font-size: 20px;"></i>
                    <h2 class="h5 mb-0">Bộ lọc</h2>
                </div>
                <form th:action="@{/medicines/view-medicine}" method="get">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Tên thuốc</label>
                            <input type="text" class="form-control" id="searchName" name="searchName" th:value="${searchName}" placeholder="Tên thuốc">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Loại thuốc</label>
                            <select class="form-select" id="searchType" name="searchType">
                                <option value="">Loại thuốc</option>
                                <option value="giam_dau" th:selected="${searchType == 'giam_dau'}">Giảm đau</option>
                                <option value="khang_sinh" th:selected="${searchType == 'khang_sinh'}">Kháng sinh</option>
                                <option value="chong_viem" th:selected="${searchType == 'chong_viem'}">Chống viêm</option>
                                <option value="thuoc_ha_huyet_ap" th:selected="${searchType == 'thuoc_ha_huyet_ap'}">Thuốc hạ huyết áp</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Nhà cung cấp</label>
                            <select class="form-select" id="searchSupplier" name="searchSupplier">
                                <option value="">Nhà cung cấp</option>
                                <option value="Pfizer" th:selected="${searchSupplier == 'Pfizer'}">Pfizer</option>
                                <option value="Novartis" th:selected="${searchSupplier == 'Novartis'}">Novartis</option>
                                <option value="Johnson" th:selected="${searchSupplier == 'Johnson'}">Johnson</option>
                                <option value="Roche" th:selected="${searchSupplier == 'Roche'}">Roche</option>
                                <option value="Merck" th:selected="${searchSupplier == 'Merck'}">Merck</option>
                                <option value="Sanofi" th:selected="${searchSupplier == 'Sanofi'}">Sanofi</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end gap-2">
                            <button class="btn btn-primary flex-grow-1 d-flex align-items-center justify-content-center gap-2" type="submit" id="filterButton">
                                <i class="bi bi-search"></i> Lọc
                            </button>
                            <button th:if="${searchName != null and searchName != '' or searchType != null and searchType != '' or searchSupplier != null and searchSupplier != ''}" 
                                    class="btn btn-secondary flex-grow-1 d-flex align-items-center justify-content-center gap-2" type="button" id="clearFilters">
                                <i class="bi bi-x"></i> Xóa Lọc
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <div class="p-2 d-flex justify-content-between align-items-center border-bottom">
                    <div class="text-muted fs-5" th:if="${medicines != null}">
                        <i class="bi bi-capsule-pill"></i>
                        <span class="fw-bold" th:text="${#lists.size(medicines)}">0</span>
                        <span>/</span>
                        <span class="fw-bold" th:text="${totalItems}">0</span>
                        <span>thuốc</span>
                    </div>
                    <a th:if="${isManager}" class="btn btn-success d-flex align-items-center gap-2" th:href="@{/medicines/add}">
                        <i class="bi bi-plus"></i> Thêm mới thuốc
                    </a>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th style="white-space: nowrap;">STT</th>
                            <th style="white-space: nowrap;">Ảnh</th>
                            <th style="white-space: nowrap;">
                                Tên thuốc
                                <a th:href="@{/medicines/view-medicine(page=${currentPage}, size=${pageSize}, sortBy='name', sortDirection=${sortBy == 'name' and sortDirection == 'asc' ? 'desc' : 'asc'}, searchName=${searchName}, searchType=${searchType}, searchSupplier=${searchSupplier})}">
                                    <i th:class="${sortBy == 'name'} ? (${sortDirection == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up'"></i>
                                </a>
                            </th>
                            <th style="white-space: nowrap;">Loại thuốc</th>
                            <th style="white-space: nowrap;">HSD</th>
                            <th style="white-space: nowrap;">
                                Giá
                                <a th:href="@{/medicines/view-medicine(page=${currentPage}, size=${pageSize}, sortBy='price', sortDirection=${sortBy == 'price' and sortDirection == 'asc' ? 'desc' : 'asc'}, searchName=${searchName}, searchType=${searchType}, searchSupplier=${searchSupplier})}">
                                    <i th:class="${sortBy == 'price'} ? (${sortDirection == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up'"></i>
                                </a>
                            </th>
                            <th style="white-space: nowrap;">Số lượng tồn kho</th>
                            <th style="white-space: nowrap;">Nhà cung cấp</th>
                            <th style="white-space: nowrap; min-width: 200px;">Hướng dẫn sử dụng</th>
                            <th style="white-space: nowrap;">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="medicine, iterStat : ${medicines}">
                            <td style="white-space: nowrap;" th:text="${currentPage * pageSize + iterStat.index + 1}"></td>
                            <td style="white-space: nowrap;">
                                <img th:if="${medicine.image != null and medicine.image != '/images/default-medicine.jpg'}" th:src="${medicine.image}" th:onerror="this.src='/images/default-medicine.jpg'" alt="Thumbnail" class="img-fluid rounded" style="width: 50px; height: 50px; object-fit: cover;">
                                <img th:if="${medicine.image == null or medicine.image == '/images/default-medicine.jpg'}" src="/images/default-medicine.jpg" alt="No image" class="img-fluid rounded" style="width: 50px; height: 50px; object-fit: cover;">
                            </td>
                            <td style="white-space: nowrap;" th:text="${medicine.name}"></td>
                            <td style="white-space: nowrap;" th:text="${medicine.type != null ? medicine.type.displayName : 'N/A'}"></td>
                            <td style="white-space: nowrap;" th:text="${medicine.expiryDate != null ? #temporals.format(medicine.expiryDate, 'dd/MM/yyyy') : 'N/A'}"></td>
                            <td style="white-space: nowrap;" th:text="${medicine.price != null ? #numbers.formatDecimal(medicine.price, 0, 2, 'COMMA') + ' VNĐ' : 'N/A'}"></td>
                            <td class="text-center" style="white-space: nowrap;" th:text="${medicine.stockQuantity != null ? medicine.stockQuantity : '0'}"></td>
                            <td class="text-center" style="white-space: nowrap;" th:text="${medicine.supplier != null ? medicine.supplier.displayName : 'N/A'}"></td>
                            <td style="max-width: 250px; white-space: normal; overflow: hidden; text-overflow: ellipsis;">
                                <span th:if="${medicine.usageInstructions != null and !#strings.isEmpty(medicine.usageInstructions)}" 
                                      th:text="${medicine.usageInstructions}"></span>
                                <span th:if="${medicine.usageInstructions == null or #strings.isEmpty(medicine.usageInstructions)}" class="text-muted">Chưa có</span>
                            </td>
                            <td style="white-space: nowrap;">
                                <div class="d-flex gap-2">
                                    <a class="btn btn-primary btn-sm btn-action-edit text-white" th:href="@{/medicines/edit/{id}(id=${medicine.id}, page=${currentPage}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, searchName=${searchName}, searchType=${searchType}, searchSupplier=${searchSupplier})}"><i class="bi bi-pencil"></i></a>
                                    <button class="btn btn-danger btn-sm btn-action-delete text-white" th:onclick="'deleteMedicine(' + ${medicine.id} + ')'"><i class="bi bi-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${medicines == null or medicines.isEmpty()}">
                            <td colspan="9" class="text-center">Không tìm thấy dữ liệu thuốc nào.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-3 d-flex justify-content-center border-top" th:if="${totalPages > 1}">
                    <nav aria-label="Phân trang danh sách thuốc">
                        <ul class="pagination mb-0">
                            <!-- First page button -->
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link text-dark" th:href="@{/medicines/view-medicine(page=0, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, searchName=${searchName}, searchType=${searchType}, searchSupplier=${searchSupplier})}" aria-label="First">
                                    <span aria-hidden="true">&laquo;&laquo;</span>
                                </a>
                            </li>
                            
                            <!-- Previous button (circular: nếu ở trang đầu thì về trang cuối) -->
                            <li class="page-item">
                                <a class="page-link text-dark" th:href="@{/medicines/view-medicine(page=${currentPage == 0 ? totalPages - 1 : currentPage - 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, searchName=${searchName}, searchType=${searchType}, searchSupplier=${searchSupplier})}" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>
                            
                            <!-- Trang 1 -->
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'active'">
                                <a class="page-link text-dark" th:href="@{/medicines/view-medicine(page=0, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, searchName=${searchName}, searchType=${searchType}, searchSupplier=${searchSupplier})}">1</a>
                            </li>
                            
                            <!-- Trang 2 (nếu không phải trang cuối) -->
                            <li class="page-item" th:if="${totalPages > 2}" th:classappend="${currentPage == 1} ? 'active'">
                                <a class="page-link text-dark" th:href="@{/medicines/view-medicine(page=1, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, searchName=${searchName}, searchType=${searchType}, searchSupplier=${searchSupplier})}">2</a>
                            </li>
                            
                            <!-- Dấu ... sau trang 2 -->
                            <li class="page-item disabled" th:if="${currentPage > 3 and totalPages > 4}">
                                <span class="page-link text-dark">...</span>
                            </li>
                            
                            <!-- Trang currentPage-1 (nếu > 2) -->
                            <li class="page-item" th:if="${currentPage > 2 and currentPage < totalPages - 1}">
                                <a class="page-link text-dark" th:href="@{/medicines/view-medicine(page=${currentPage - 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, searchName=${searchName}, searchType=${searchType}, searchSupplier=${searchSupplier})}" th:text="${currentPage}"></a>
                            </li>
                            
                            <!-- Trang hiện tại (nếu không phải trang 1, 2 hoặc cuối) -->
                            <li class="page-item active" th:if="${currentPage > 1 and currentPage < totalPages - 1}">
                                <a class="page-link text-dark" th:href="@{/medicines/view-medicine(page=${currentPage}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, searchName=${searchName}, searchType=${searchType}, searchSupplier=${searchSupplier})}" th:text="${currentPage + 1}"></a>
                            </li>
                            
                            <!-- Trang currentPage+1 (nếu < totalPages-1) -->
                            <li class="page-item" th:if="${currentPage >= 1 and currentPage < totalPages - 2}">
                                <a class="page-link text-dark" th:href="@{/medicines/view-medicine(page=${currentPage + 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, searchName=${searchName}, searchType=${searchType}, searchSupplier=${searchSupplier})}" th:text="${currentPage + 2}"></a>
                            </li>
                            
                            <!-- Dấu ... trước trang cuối -->
                            <li class="page-item disabled" th:if="${currentPage < totalPages - 4 and totalPages > 4}">
                                <span class="page-link text-dark">...</span>
                            </li>
                            
                            <!-- Trang cuối -->
                            <li class="page-item" th:if="${totalPages > 2}" th:classappend="${currentPage == totalPages - 1} ? 'active'">
                                <a class="page-link text-dark" th:href="@{/medicines/view-medicine(page=${totalPages - 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, searchName=${searchName}, searchType=${searchType}, searchSupplier=${searchSupplier})}" th:text="${totalPages}"></a>
                            </li>
                            
                            <!-- Next button (circular: nếu ở trang cuối thì về trang đầu) -->
                            <li class="page-item">
                                <a class="page-link text-dark" th:href="@{/medicines/view-medicine(page=${currentPage == totalPages - 1 ? 0 : currentPage + 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, searchName=${searchName}, searchType=${searchType}, searchSupplier=${searchSupplier})}" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                            
                            <!-- Last page button -->
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link text-dark" th:href="@{/medicines/view-medicine(page=${totalPages - 1}, size=${pageSize}, sortBy=${sortBy}, sortDirection=${sortDirection}, searchName=${searchName}, searchType=${searchType}, searchSupplier=${searchSupplier})}" aria-label="Last">
                                    <span aria-hidden="true">&raquo;&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                window.location.href = link.getAttribute('href');
            });
        });

        document.getElementById('clearFilters').addEventListener('click', () => {
            document.getElementById('searchName').value = '';
            document.getElementById('searchType').value = '';
            document.getElementById('searchSupplier').value = '';
            window.location.href = '/medicines/view-medicine';
        });

        // Nhúng các giá trị từ Thymeleaf vào JavaScript
        const currentPage = [[${currentPage}]];
        const pageSize = [[${pageSize}]];
        const sortBy = [[${sortBy}]];
        const sortDirection = [[${sortDirection}]];
        const searchName = [[${searchName}]] || '';
        const searchType = [[${searchType}]] || '';
        const searchSupplier = [[${searchSupplier}]] || '';

        window.deleteMedicine = function(id) {
            if (confirm('Bạn có chắc muốn xóa thuốc này?')) {
                fetch(`/medicines/delete/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        page: currentPage,
                        size: pageSize,
                        sortBy: sortBy,
                        sortDirection: sortDirection,
                        searchName: searchName,
                        searchType: searchType,
                        searchSupplier: searchSupplier
                    })
                })
                    .then(response => {
                        if (response.ok) {
                            window.location.reload();
                        } else {
                            response.text().then(text => alert('Xóa thất bại: ' + (text || 'Lỗi không xác định')));
                        }
                    })
                    .catch(error => alert('Lỗi khi xóa thuốc: ' + error.message));
            }
        };
    });
</script>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
