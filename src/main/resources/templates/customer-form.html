<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ CỬA HÀNG THUỐC - Thêm/Sửa Khách Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/medicine.css}">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{sidebar :: sidebar}"></div>

    <div class="main-content flex-grow-1 bg-light p-4">
        <div class="container-fluid">
            <h2 class="h4 mb-4" th:text="${customer.id != null} ? 'Sửa Khách Hàng' : 'Thêm Khách Hàng Mới'"></h2>
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${message != null}" class="alert alert-success" th:text="${message}"></div>

            <form th:action="${customer.id != null} ? @{/customers/update/{id}(id=${customer.id})} : @{/customers/add}"
                  th:object="${customer}"
                  method="post">
                <input type="hidden" name="page" th:value="${page}">
                <input type="hidden" name="size" th:value="${size}">
                <input type="hidden" name="sortBy" th:value="${sortBy}">
                <input type="hidden" name="sortDirection" th:value="${sortDirection}">
                <input type="hidden" name="keyword" th:value="${keyword}">
                <input type="hidden" name="phone" th:value="${phone}">
                <input type="hidden" name="customerType" th:value="${customerType}">

                <div class="mb-3">
                    <label for="name" class="form-label">Tên khách hàng</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Số điện thoại</label>
                    <input type="text" class="form-control" id="phone" th:field="*{phone}" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}">
                </div>
                <div class="mb-3">
                    <label for="customerType" class="form-label">Loại khách hàng <span class="text-danger">*</span></label>
                    <select class="form-select" id="customerType" th:field="*{customerType}" required>
                        <option value="">Chọn loại khách hàng</option>
                        <option value="vang_lai" th:selected="${customer.customerType == T(com.example.quanlicuahangthuoc.entity.Customer$CustomerType).vang_lai}">Vãng lai</option>
                        <option value="than_thiet" th:selected="${customer.customerType == T(com.example.quanlicuahangthuoc.entity.Customer$CustomerType).than_thiet}">Thân thiết</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="rewardPoints" class="form-label">Điểm thưởng</label>
                    <input type="number" class="form-control" id="rewardPoints" th:field="*{rewardPoints}" min="0">
                </div>
                <button type="submit" class="btn btn-primary">Lưu</button>
                <a class="btn btn-secondary" th:href="@{/customers/view-customers(page=${page}, size=${size}, sortBy=${sortBy}, sortDirection=${sortDirection}, keyword=${keyword}, phone=${phone}, customerType=${customerType})}">Hủy</a>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
