<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách chi tiết đơn hàng</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

<h2 class="mb-3">Danh sách chi tiết đơn hàng</h2>

<table class="table table-bordered table-striped">
    <thead>
    <tr>
        <th>ID</th>
        <th>Mã đơn hàng</th>
        <th>Tên thuốc</th>
        <th>Số lượng</th>
        <th>Đơn giá</th>
        <th>Tổng tiền</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="detail : ${orderDetailsPage.content}">
        <td th:text="${detail.id}"></td>
        <td th:text="${detail.order.id}"></td>
        <td th:text="${detail.medicine.name}"></td>
        <td th:text="${detail.quantity}"></td>
        <td th:text="${detail.unitPrice}"></td>
        <td th:text="${detail.totalPrice}"></td>
    </tr>
    </tbody>
</table>

<!-- PHÂN TRANG -->
<nav>
    <ul class="pagination">
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link"
               th:href="@{/order-details(page=${currentPage - 1}, size=10, sortBy=${sortBy}, direction=${direction})}">
                Trước
            </a>
        </li>

        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link"
               th:href="@{/order-details(page=${i}, size=10, sortBy=${sortBy}, direction=${direction})}"
               th:text="${i + 1}"></a>
        </li>

        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
            <a class="page-link"
               th:href="@{/order-details(page=${currentPage + 1}, size=10, sortBy=${sortBy}, direction=${direction})}">
                Sau
            </a>
        </li>
    </ul>
</nav>

<!-- THỐNG KÊ -->
<div class="mt-3">
    <p><b>Tổng doanh thu:</b> <span th:text="${totalRevenue}"></span></p>
    <p><b>Tổng sản phẩm bán:</b> <span th:text="${totalProductsSold}"></span></p>
    <p><b>Tổng số đơn hàng:</b> <span th:text="${totalOrders}"></span></p>
</div>

</body>
</html>
