<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUẢN LÝ CỬA HÀNG THUỐC - Danh Sách Thanh Toán</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/medicine.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
<div class="d-flex">
  <div th:replace="~{sidebar :: sidebar}"></div>

  <div class="main-content flex-grow-1 bg-light p-4">
    <div class="container-fluid">
      <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
      <div th:if="${message != null}" class="alert alert-success" th:text="${message}"></div>

      <!-- Tiêu đề trang -->
      <div class="mb-4">
        <h1 class="display-6 fw-bold text-primary">
          <i class="bi bi-credit-card"></i> DANH SÁCH THANH TOÁN
        </h1>
      </div>

      <div class="filter-panel mb-4">
        <div class="d-flex align-items-center gap-3 mb-4">
          <i class="bi bi-funnel-fill text-secondary" style="font-size: 20px;"></i>
          <h2 class="h5 mb-0">Bộ lọc</h2>
        </div>
        <form th:action="@{/payments/view-payments}" method="get">
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label">Mã đơn</label>
              <input type="number" class="form-control" id="orderId" name="orderId" th:value="${orderId}" placeholder="Mã đơn" min="1">
            </div>
            <div class="col-md-3">
              <label class="form-label">Từ ngày</label>
              <input type="text" class="form-control" id="fromDate" name="fromDate" th:value="${fromDate}" placeholder="dd/MM/yyyy">
            </div>
            <div class="col-md-3">
              <label class="form-label">Đến ngày</label>
              <input type="text" class="form-control" id="toDate" name="toDate" th:value="${toDate}" placeholder="dd/MM/yyyy">
            </div>
            <div class="col-md-3 d-flex align-items-end gap-2">
              <button class="btn btn-primary flex-grow-1 d-flex align-items-center justify-content-center gap-2" type="submit" id="filterButton">
                <i class="bi bi-search"></i> Lọc
              </button>
              <button th:if="${orderId != null or (fromDate != null and fromDate != '') or (toDate != null and toDate != '')}" 
                      class="btn btn-secondary flex-grow-1 d-flex align-items-center justify-content-center gap-2" type="button" id="clearFilters">
                <i class="bi bi-x"></i> Xóa Lọc
              </button>
            </div>
          </div>
        </form>
      </div>

      <div class="table-container">
        <div class="p-2 d-flex justify-content-between align-items-center border-bottom">
          <div class="text-muted fs-5" th:if="${payments != null}">
            <i class="bi bi-credit-card"></i>
            <span class="fw-bold" th:text="${#lists.size(payments)}">0</span>
            <span>/</span>
            <span class="fw-bold" th:text="${totalItems}">0</span>
            <span>thanh toán</span>
          </div>
          <a class="btn btn-success d-flex align-items-center gap-2" th:href="@{/payments/new}">
            <i th:if="${isManager}" class="bi bi-plus"></i> Thêm mới thanh toán
          </a>
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
            <tr>
              <th style="white-space: nowrap;">STT</th>
              <th style="white-space: nowrap;">Mã đơn</th>
              <th style="white-space: nowrap;">Phương thức</th>
              <th style="white-space: nowrap;">
                Số tiền
                <a th:href="@{/payments/view-payments(page=${currentPage}, size=${pageSize}, sortField='amount', sortDir=${sortField == 'amount' and sortDir == 'asc' ? 'desc' : 'asc'}, orderId=${orderId}, paymentDate=${paymentDate})}">
                  <i th:class="${sortField == 'amount'} ? (${sortDir == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up'"></i>
                </a>
              </th>
              <th style="white-space: nowrap;">Tiền thừa</th>
              <th style="white-space: nowrap;">
                Ngày TT
                <a th:href="@{/payments/view-payments(page=${currentPage}, size=${pageSize}, sortField='paymentDate', sortDir=${sortField == 'paymentDate' and sortDir == 'asc' ? 'desc' : 'asc'}, orderId=${orderId}, paymentDate=${paymentDate})}">
                  <i th:class="${sortField == 'paymentDate'} ? (${sortDir == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up'"></i>
                </a>
              </th>
              <th th:if="${isManager}" style="white-space: nowrap;">Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="payment, iterStat : ${payments}">
              <td style="white-space: nowrap;" th:text="${currentPage * pageSize + iterStat.index + 1}"></td>
              <td style="white-space: nowrap;" th:text="${payment.order != null ? payment.order.id : 'N/A'}"></td>
              <td style="white-space: nowrap;" th:text="${payment.paymentMethod != null ? payment.paymentMethod.displayName : 'N/A'}"></td>
              <td style="white-space: nowrap;" th:text="${payment.amount != null ? #numbers.formatDecimal(payment.amount, 0, 2, 'COMMA') + ' VNĐ' : 'N/A'}"></td>
              <td style="white-space: nowrap;" th:text="${payment.change != null ? #numbers.formatDecimal(payment.change, 0, 2, 'COMMA') + ' VNĐ' : 'N/A'}"></td>
              <td style="white-space: nowrap;" th:text="${payment.paymentDate != null ? #temporals.format(payment.paymentDate, 'dd/MM/yyyy') : 'N/A'}"></td>
              <td style="white-space: nowrap;">
                <div class="d-flex gap-2">
                  <a th:if="${isManager}" class="btn btn-primary btn-sm btn-action-edit text-white" th:href="@{/payments/edit/{id}(id=${payment.id}, page=${currentPage}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir}, orderId=${orderId}, paymentDate=${paymentDate})}">
                    <i class="bi bi-pencil"></i>
                  </a>
                  <form th:action="@{/payments/delete/{id}(id=${payment.id})}" method="post" style="display:inline;">
                    <input type="hidden" name="page" th:value="${currentPage}">
                    <input type="hidden" name="size" th:value="${pageSize}">
                    <input type="hidden" name="sortField" th:value="${sortField}">
                    <input type="hidden" name="sortDir" th:value="${sortDir}">
                    <input type="hidden" name="orderId" th:value="${orderId}">
                    <input type="hidden" name="fromDate" th:value="${fromDate}">
                    <input type="hidden" name="toDate" th:value="${toDate}">
                    <button th:if="${isManager}" type="submit" class="btn btn-danger btn-sm btn-action-delete text-white" onclick="return confirm('Bạn có chắc muốn xóa thanh toán này?')">
                      <i class="bi bi-trash"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
            <tr th:if="${payments == null or payments.isEmpty()}">
              <td colspan="7" class="text-center">Không tìm thấy dữ liệu thanh toán nào.</td>
            </tr>
            </tbody>
          </table>
        </div>
        <div class="p-3 d-flex justify-content-center border-top" th:if="${totalPages > 1}">
          <nav aria-label="Phân trang danh sách thanh toán">
            <ul class="pagination mb-0">
              <!-- First page button -->
              <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link text-dark" th:href="@{/payments/view-payments(page=0, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir}, orderId=${orderId}, paymentDate=${paymentDate})}" aria-label="First">
                  <span aria-hidden="true">&laquo;&laquo;</span>
                </a>
              </li>
              
              <!-- Previous button (circular) -->
              <li class="page-item">
                <a class="page-link text-dark" th:href="@{/payments/view-payments(page=${currentPage == 0 ? totalPages - 1 : currentPage - 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir}, orderId=${orderId}, paymentDate=${paymentDate})}" aria-label="Previous">
                  <span aria-hidden="true">&laquo;</span>
                </a>
              </li>
              
              <!-- Trang 1 -->
              <li class="page-item" th:classappend="${currentPage == 0} ? 'active'">
                <a class="page-link text-dark" th:href="@{/payments/view-payments(page=0, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir}, orderId=${orderId}, paymentDate=${paymentDate})}">1</a>
              </li>
              
              <!-- Trang 2 -->
              <li class="page-item" th:if="${totalPages > 2}" th:classappend="${currentPage == 1} ? 'active'">
                <a class="page-link text-dark" th:href="@{/payments/view-payments(page=1, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir}, orderId=${orderId}, paymentDate=${paymentDate})}">2</a>
              </li>
              
              <!-- Dấu ... sau trang 2 -->
              <li class="page-item disabled" th:if="${currentPage > 3 and totalPages > 4}">
                <span class="page-link text-dark">...</span>
              </li>
              
              <!-- Trang currentPage-1 -->
              <li class="page-item" th:if="${currentPage > 2 and currentPage < totalPages - 1}">
                <a class="page-link text-dark" th:href="@{/payments/view-payments(page=${currentPage - 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir}, orderId=${orderId}, paymentDate=${paymentDate})}" th:text="${currentPage}"></a>
              </li>
              
              <!-- Trang hiện tại -->
              <li class="page-item active" th:if="${currentPage > 1 and currentPage < totalPages - 1}">
                <a class="page-link text-dark" th:href="@{/payments/view-payments(page=${currentPage}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir}, orderId=${orderId}, paymentDate=${paymentDate})}" th:text="${currentPage + 1}"></a>
              </li>
              
              <!-- Trang currentPage+1 -->
              <li class="page-item" th:if="${currentPage >= 1 and currentPage < totalPages - 2}">
                <a class="page-link text-dark" th:href="@{/payments/view-payments(page=${currentPage + 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir}, orderId=${orderId}, paymentDate=${paymentDate})}" th:text="${currentPage + 2}"></a>
              </li>
              
              <!-- Dấu ... trước trang cuối -->
              <li class="page-item disabled" th:if="${currentPage < totalPages - 4 and totalPages > 4}">
                <span class="page-link text-dark">...</span>
              </li>
              
              <!-- Trang cuối -->
              <li class="page-item" th:if="${totalPages > 1}" th:classappend="${currentPage == totalPages - 1} ? 'active'">
                <a class="page-link text-dark" th:href="@{/payments/view-payments(page=${totalPages - 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir}, orderId=${orderId}, paymentDate=${paymentDate})}" th:text="${totalPages}"></a>
              </li>
              
              <!-- Next button (circular) -->
              <li class="page-item">
                <a class="page-link text-dark" th:href="@{/payments/view-payments(page=${currentPage == totalPages - 1 ? 0 : currentPage + 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir}, orderId=${orderId}, paymentDate=${paymentDate})}" aria-label="Next">
                  <span aria-hidden="true">&raquo;</span>
                </a>
              </li>
              
              <!-- Last page button -->
              <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link text-dark" th:href="@{/payments/view-payments(page=${totalPages - 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir}, orderId=${orderId}, paymentDate=${paymentDate})}" aria-label="Last">
                  <span aria-hidden="true">&raquo;&raquo;</span>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>
<script th:inline="javascript">
  document.addEventListener('DOMContentLoaded', () => {
    // Khởi tạo Flatpickr cho khoảng thời gian
    flatpickr("#fromDate", {
      dateFormat: "d/m/Y",
      locale: "vn",
      allowInput: true
    });

    flatpickr("#toDate", {
      dateFormat: "d/m/Y",
      locale: "vn",
      allowInput: true
    });
    const navLinks = document.querySelectorAll('.nav-link');
    navLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        navLinks.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
        window.location.href = link.getAttribute('href');
      });
    });

    document.getElementById('clearFilters').addEventListener('click', () => {
      window.location.href = '/payments/view-payments';
    });
  });
</script>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
