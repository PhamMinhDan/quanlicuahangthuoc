<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ CỬA HÀNG THUỐC - Chi Tiết Khuyến Mãi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/medicine.css}">
</head>
<body>
    <div class="d-flex">
        <div th:replace="~{sidebar :: sidebar}"></div>

        <div class="main-content flex-grow-1 bg-light p-4">
            <div class="container-fluid">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <a th:href="@{/promotions}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Quay lại
                    </a>
                    <h2 class="h4 mb-0">Chi Tiết Khuyến Mãi</h2>
                </div>

                <div class="table-container">
                    <div class="p-4">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-4">
                                    <label class="form-label text-muted">ID</label>
                                    <p class="h5" th:text="${promotion.id}"></p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-4">
                                    <label class="form-label text-muted">Trạng thái</label>
                                    <p>
                                        <span class="badge bg-success">Còn hạn</span>
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-4">
                                    <label class="form-label text-muted">Tên khuyến mãi</label>
                                    <p class="h5" th:text="${promotion.name}"></p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-4">
                                    <label class="form-label text-muted">Loại khuyến mãi</label>
                                    <p class="h5">
                                        <span th:if="${promotion.type == 'giam_gia_pha_tram'}">Giảm giá phần trăm</span>
                                        <span th:if="${promotion.type == 'giam_gia_co_dinh'}">Giảm giá cố định</span>
                                        <span th:if="${promotion.type != 'giam_gia_pha_tram' and promotion.type != 'giam_gia_co_dinh'}" th:text="${promotion.type}"></span>
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-4">
                                    <label class="form-label text-muted">Phần trăm giảm giá</label>
                                    <p class="h5 text-success" th:text="${promotion.discountPercent + '%'}"></p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-4">
                                    <label class="form-label text-muted">Ngày hết hạn</label>
                                    <p class="h5">
                                        <span th:text="${#temporals.format(promotion.expiredDate, 'dd/MM/yyyy')}"></span>
                                        <span th:if="${promotion.expiredDate != null and promotion.expiredDate.isAfter(#temporals.createToday())}" class="badge bg-success ms-2">Còn hạn</span>
                                        <span th:if="${promotion.expiredDate != null and (promotion.expiredDate.isBefore(#temporals.createToday()) or promotion.expiredDate.isEqual(#temporals.createToday()))}" class="badge bg-danger ms-2">Hết hạn</span>
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <a th:href="@{/promotions/edit/{id}(id=${promotion.id})}" class="btn btn-primary">
                                <i class="bi bi-pencil"></i> Chỉnh sửa
                            </a>
                            <a th:href="@{/promotions/delete/{id}(id=${promotion.id})}" class="btn btn-danger" onclick="return confirm('Bạn có chắc muốn xóa khuyến mãi này?')">
                                <i class="bi bi-trash"></i> Xóa
                            </a>
                            <a th:href="@{/promotions}" class="btn btn-secondary">
                                <i class="bi bi-x"></i> Đóng
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{footer :: footer}"></div>
</body>
</html>
