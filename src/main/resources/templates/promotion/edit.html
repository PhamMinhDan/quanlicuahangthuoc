<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ CỬA HÀNG THUỐC - Sửa Khuyến Mãi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/medicine.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <div class="d-flex">
        <div th:replace="~{sidebar :: sidebar}"></div>

        <div class="main-content flex-grow-1 bg-light p-4">
            <div class="container-fluid">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <a th:href="@{/promotions}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Quay lại
                    </a>
                    <h2 class="h4 mb-0">Sửa Khuyến Mãi</h2>
                </div>

                <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
                <div th:if="${message != null}" class="alert alert-success" th:text="${message}"></div>

                <div class="table-container">
                    <div class="p-4">
                        <form th:action="@{/promotions/update/{id}(id=${promotion.id})}" th:object="${promotion}" method="post">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="id" class="form-label">ID</label>
                                        <input type="text" class="form-control" id="id" th:value="${promotion.id}" disabled>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Tên khuyến mãi <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Nhập tên khuyến mãi" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="type" class="form-label">Loại khuyến mãi <span class="text-danger">*</span></label>
                                        <select class="form-select" id="type" th:field="*{type}" required>
                                            <option value="">-- Chọn loại khuyến mãi --</option>
                                            <option value="giam_gia_pha_tram">Giảm giá phần trăm</option>
                                            <option value="giam_gia_co_dinh">Giảm giá cố định</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="discountPercent" class="form-label">Phần trăm giảm giá (%) <span class="text-danger">*</span></label>
                                        <input type="number" class="form-control" id="discountPercent" th:field="*{discountPercent}" step="0.01" min="0" max="100" placeholder="0.00" required>
                                        <small class="text-muted">Nhập giá trị từ 0 đến 100</small>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="expiredDate" class="form-label">Ngày hết hạn <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="expiredDateDisplay" placeholder="dd/MM/yyyy" required>
                                        <input type="hidden" id="expiredDate" th:field="*{expiredDate}">
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Cập nhật khuyến mãi
                                </button>
                                <a th:href="@{/promotions}" class="btn btn-secondary">
                                    <i class="bi bi-x"></i> Hủy
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const expiredDateValue = /*[[${promotion.expiredDate}]]*/ '';
            
            flatpickr("#expiredDateDisplay", {
                dateFormat: "d/m/Y",
                locale: "vn",
                allowInput: false,
                disableMobile: true,
                defaultDate: expiredDateValue,
                onChange: function(selectedDates, dateStr, instance) {
                    if (selectedDates.length > 0) {
                        const date = selectedDates[0];
                        const yyyy = date.getFullYear();
                        const mm = String(date.getMonth() + 1).padStart(2, '0');
                        const dd = String(date.getDate()).padStart(2, '0');
                        document.getElementById('expiredDate').value = yyyy + '-' + mm + '-' + dd;
                    }
                }
            });
        });
        </script>
        <div th:replace="~{footer :: footer}"></div>
    </body>
</html>
