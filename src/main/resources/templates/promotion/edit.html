<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ CỬA HÀNG THUỐC - Sửa Khuyến Mãi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/medicine.css}">
    <link rel="stylesheet" th:href="@{/notification.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{sidebar :: sidebar}"></div>

    <div class="main-content flex-grow-1 bg-light p-4">
        <div class="container-fluid">
            <div class="d-flex align-items-center gap-3 mb-4">
                <a th:href="@{/promotions}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Quay lại
                </a>
                <h2 class="h4 mb-0">Sửa Khuyến Mãi</h2>
            </div>

            <div class="table-container">
                <div class="p-4">
                    <form th:action="@{/promotions/update/{id}(id=${promotion.id})}"
                          th:object="${promotion}"
                          method="post"
                          id="promotionForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="name" class="form-label">
                                        <i class="bi bi-gift"></i> Tên khuyến mãi <span class="text-danger">*</span>
                                    </label>
                                    <input type="text"
                                           class="form-control"
                                           id="name"
                                           th:field="*{name}"
                                           placeholder="Nhập tên khuyến mãi"
                                           required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="type" class="form-label">
                                        <i class="bi bi-tag"></i> Loại khuyến mãi <span class="text-danger">*</span>
                                    </label>
                                    <select class="form-select" id="type" th:field="*{type}" required>
                                        <option value="">-- Chọn loại khuyến mãi --</option>
                                        <option th:each="t : ${T(com.example.quanlicuahangthuoc.entity.Promotion.PromotionType).values()}"
                                                th:value="${t}"
                                                th:text="${t.displayName}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="discountPercent" class="form-label">
                                        <i class="bi bi-percent"></i> Phần trăm giảm giá (%) <span class="text-danger">*</span>
                                    </label>
                                    <input type="number"
                                           class="form-control"
                                           id="discountPercent"
                                           th:field="*{discountPercent}"
                                           step="0.01"
                                           min="0"
                                           max="100"
                                           placeholder="0.00"
                                           required>
                                    <small class="text-muted">Nhập giá trị từ 0 đến 100</small>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="expiredDateDisplay" class="form-label">
                                        <i class="bi bi-calendar-event"></i> Ngày hết hạn <span class="text-danger">*</span>
                                    </label>
                                    <input type="text"
                                           class="form-control"
                                           id="expiredDateDisplay"
                                           placeholder="dd/MM/yyyy"
                                           required
                                           readonly>
                                    <!-- Hidden input để submit về server -->
                                    <input type="hidden"
                                           id="expiredDate"
                                           name="expiredDate"
                                           th:value="${promotion.expiredDate != null ? #temporals.format(promotion.expiredDate, 'yyyy-MM-dd') : ''}">
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button th:if="${isManager}" type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Cập nhật khuyến mãi
                            </button>
                            <a th:href="@{/promotions}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Hủy
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>
<script th:src="@{/notification.js}"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const expiredDateDisplay = document.getElementById('expiredDateDisplay');
        const expiredDateHidden = document.getElementById('expiredDate');
        const form = document.getElementById('promotionForm');

        // Lấy giá trị từ hidden input (format yyyy-MM-dd từ Thymeleaf)
        const expiredDateValue = expiredDateHidden.value;

        console.log('=== DATE DEBUG ===');
        console.log('Expired date from server:', expiredDateValue);
        console.log('Hidden input value:', expiredDateHidden.value);

        // Parse date từ yyyy-MM-dd
        let initialDate = null;
        if (expiredDateValue && expiredDateValue.trim() !== '') {
            // Parse thủ công để tránh timezone issues
            const parts = expiredDateValue.split('-');
            if (parts.length === 3) {
                const year = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1; // Month is 0-indexed
                const day = parseInt(parts[2], 10);
                initialDate = new Date(year, month, day);
                console.log('Parsed date:', initialDate);
                console.log('Date parts - Year:', year, 'Month:', month + 1, 'Day:', day);
            }
        }

        // Khởi tạo Flatpickr
        const fp = flatpickr(expiredDateDisplay, {
            dateFormat: "d/m/Y",
            locale: "vn",
            allowInput: false,
            disableMobile: true,
            defaultDate: initialDate, // Sử dụng Date object thay vì string
            onChange: function(selectedDates, dateStr, instance) {
                if (selectedDates.length > 0) {
                    const date = selectedDates[0];
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');

                    // Set hidden input theo format yyyy-MM-dd cho Spring Boot
                    expiredDateHidden.value = `${year}-${month}-${day}`;

                    console.log('Date changed to:', expiredDateHidden.value);
                    console.log('Display format:', dateStr);

                    // Remove validation error
                    expiredDateDisplay.classList.remove('is-invalid');
                }
            },
            onReady: function(selectedDates, dateStr, instance) {
                console.log('Flatpickr ready');
                console.log('Selected dates:', selectedDates);
                console.log('Date string:', dateStr);
                console.log('Hidden input value:', expiredDateHidden.value);

                // Verify display value
                if (selectedDates.length > 0) {
                    const displayDate = selectedDates[0];
                    console.log('Display shows:',
                        displayDate.getDate() + '/' +
                        (displayDate.getMonth() + 1) + '/' +
                        displayDate.getFullYear()
                    );
                }
            }
        });

        // Validate trước khi submit
        form.addEventListener('submit', (e) => {
            if (!expiredDateHidden.value || expiredDateHidden.value.trim() === '') {
                e.preventDefault();
                expiredDateDisplay.classList.add('is-invalid');

                if (typeof notification !== 'undefined') {
                    notification.showError('Vui lòng chọn ngày hết hạn!');
                } else {
                    alert('Vui lòng chọn ngày hết hạn!');
                }

                expiredDateDisplay.focus();
                return false;
            }

            console.log('Form submitting with date:', expiredDateHidden.value);
        });

        // Hiển thị notification nếu có lỗi từ server
        const errorMessage = /*[[${error}]]*/ null;
        const successMessage = /*[[${message}]]*/ null;

        if (errorMessage && typeof notification !== 'undefined') {
            notification.showError(errorMessage);
        }

        if (successMessage && typeof notification !== 'undefined') {
            notification.showSuccess(successMessage);
        }
    });
</script>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
