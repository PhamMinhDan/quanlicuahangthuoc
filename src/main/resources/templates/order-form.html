<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ CỬA HÀNG THUỐC - Thêm/Sửa Đơn Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/medicine.css}">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{sidebar :: sidebar}"></div>

    <div class="main-content flex-grow-1 bg-light p-4">
        <div class="container-fluid">
            <h2 class="h4 mb-4" th:text="${order.id != null} ? 'Sửa Đơn Hàng' : 'Thêm Đơn Hàng Mới'"></h2>
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${message != null}" class="alert alert-success" th:text="${message}"></div>

            <form th:action="${order.id != null} ? @{/orders/update/{id}(id=${order.id})} : @{/orders/add}"
                  th:object="${order}"
                  method="post">
                <div class="row g-3">
                    <!-- THAY ĐỔI: Từ Mã khách hàng sang Số điện thoại -->
                    <div class="col-md-6">
                        <label for="customerPhone" class="form-label">
                            <i class="bi bi-telephone"></i> Số điện thoại khách hàng <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               class="form-control"
                               id="customerPhone"
                               th:field="*{customerPhone}"
                               required
                               pattern="[0-9]{9,11}"
                               placeholder="Nhập số điện thoại (9-11 số)">
                        <small class="text-muted">Hệ thống sẽ tự động tìm khách hàng theo số điện thoại</small>
                    </div>

                    <div class="col-md-6">
                        <label for="staffId" class="form-label">
                            <i class="bi bi-person-badge"></i> Mã nhân viên <span class="text-danger">*</span>
                        </label>
                        <input type="number" class="form-control" id="staffId" th:field="*{staff.id}" required min="1">
                    </div>

                    <!-- THAY ĐỔI: Từ input Mã khuyến mãi sang select dropdown -->
                    <div class="col-md-6">
                        <label for="promotionName" class="form-label">
                            <i class="bi bi-gift"></i> Khuyến mãi
                        </label>
                        <select class="form-select" id="promotionName" th:field="*{promotionName}">
                            <option value="">-- Không áp dụng khuyến mãi --</option>
                            <option th:each="promo : ${promotions}"
                                    th:value="${promo.name}"
                                    th:text="${promo.name + ' (' + promo.discountPercent + '%)'}">
                            </option>
                        </select>
                        <small class="text-muted">Chọn khuyến mãi để áp dụng cho đơn hàng</small>
                    </div>

                    <div class="col-md-6">
                        <label for="orderDate" class="form-label">
                            <i class="bi bi-calendar"></i> Ngày đặt hàng <span class="text-danger">*</span>
                        </label>
                        <input type="date"
                               class="form-control"
                               id="orderDate"
                               name="orderDate"
                               th:value="${order.orderDate != null ? #temporals.format(order.orderDate, 'yyyy-MM-dd') : ''}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="status" class="form-label">
                            <i class="bi bi-check-circle"></i> Trạng thái <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="status" th:field="*{status}" required>
                            <option value="">Chọn trạng thái</option>
                            <option th:each="s : ${T(com.example.quanlicuahangthuoc.entity.Order.OrderStatus).values()}"
                                    th:value="${s}"
                                    th:text="${s.displayName}"
                                    th:selected="${order.status == s}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="totalAmount" class="form-label">
                            <i class="bi bi-cash"></i> Tổng tiền <span class="text-danger">*</span>
                        </label>
                        <input type="number" class="form-control" id="totalAmount" th:field="*{totalAmount}" step="0.01" min="0" required lang="en">
                    </div>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary d-flex align-items-center gap-2">
                        <i class="bi bi-save"></i> Lưu
                    </button>
                    <a class="btn btn-secondary d-flex align-items-center gap-2" th:href="@{/orders/view-orders}">
                        <i class="bi bi-x"></i> Hủy
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.querySelector('form');
        const totalAmountInput = document.getElementById('totalAmount');
        const customerPhoneInput = document.getElementById('customerPhone');

        // Validate phone number
        customerPhoneInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            if (this.value.length > 11) {
                this.value = this.value.slice(0, 11);
            }
        });

        form.addEventListener('submit', (event) => {
            // Loại bỏ dấu phẩy trong giá trị totalAmount trước khi gửi
            if (totalAmountInput.value) {
                totalAmountInput.value = totalAmountInput.value.replace(/,/g, '');
            }

            // Validate phone
            const phone = customerPhoneInput.value;
            if (phone.length < 9 || phone.length > 11) {
                event.preventDefault();
                alert('Số điện thoại phải từ 9 đến 11 chữ số!');
                customerPhoneInput.focus();
                return false;
            }
        });
    });
</script>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
